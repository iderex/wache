# The fleet's security alerts, read on a schedule so that no count grows with
# nobody watching it.
#
# WHAT FORCED IT (iderex/wache#31). Roughly 320 open code-scanning alerts on the
# Flowfin plugins alone, 62 open Dependabot alerts on one fork, and a two-to-
# three alert floor on nearly every iderex board - all of it found by a person
# asking on one evening. Nothing read those numbers before that evening and
# nothing would have read them after it. A number nobody reads twice cannot rise
# or fall; it can only be discovered again.
#
# WHAT IT DOES. Once a day it reads the open code-scanning, Dependabot and
# secret-scanning alerts of every board the roster holds, groups them by rule id,
# compares that reading against the previous one, and where a rule id is new or
# its count has risen it opens - or updates, never duplicates - one issue on the
# board the alerts are on. A count that only falls produces nothing.
#
# A BOARD THAT COULD NOT BE READ IS NOT A BOARD WITH NO ALERTS, and separating
# the two is the reason this file is longer than a loop around one endpoint.
# Scanning is not switched on everywhere. An endpoint that answers 404 because
# the feature is off, 403 because the token does not reach that board, and 200
# with an empty array are three different facts, and a sweep that folds them
# together reports a clean fleet it never measured. So a reading carries a
# per-board, per-kind STATE beside its counts, a pair that was not read
# contributes no counts at all, and the pair is named in the run summary as
# unread rather than passed over.
#
# THE COMPARISON NEVER RAISES OFF A PAIR IT HAS NOT READ TWICE. A board read
# today and unread yesterday is a FIRST READING: every rule id on it is new to
# the file and none of them is new to the board, so raising an issue for each
# would file the loudest issue of the year for a change that did not happen. The
# fixtures below carry that case by name, in both directions.
#
# WHERE THE PREVIOUS READING LIVES. In the artifact of the last successful run of
# this workflow, read back through the runs API. That is a deliberate choice over
# a file on a branch: the run history is already the audit trail of a scheduled
# job, each reading is downloadable by run number afterwards, and the sweep needs
# no write to any tree to keep its own state. What it costs is retention - an
# artifact expires, and a sweep that has not run inside the retention window
# starts again from a first reading rather than from a delta. That is stated here
# rather than discovered later.
#
# WHY THE ROSTER IS FETCHED AND NOT LISTED HERE. The boards are declared in one
# private tree, one record per board, and a list copied into this file would
# drift against it silently - a board added to the roster and not to this file is
# a board this sweep reports nothing about while looking as though it covered the
# fleet. So the roster is read at run time, and a roster that cannot be read reds
# the run instead of shrinking the population.
#
# THE MEANS IS THE SHELL AND THE PLATFORM API, as it is in every other check on
# this board. It adds no language, no runtime and no dependency this tree does
# not already carry; every figure it prints comes from a request a reader can
# repeat with `curl`; and its judgement is a pure function of two files, which is
# what lets the fixtures below refuse it before it is allowed to judge anything.
#
# THE FIXTURES RUN BEFORE THE JUDGEMENT, in the shape the rest of this board
# uses: every rule has a line that bites and a line that passes, and if a fixture
# disagrees with the rule it is meant to prove the run judges nothing.
#
# THE SECOND LEG READS A CONFIGURATION AND NOT A COUNT (iderex/wache#32). An
# alert count is a reading of what scanning FOUND, and it says nothing about
# whether scanning is still switched on: a board that loses code scanning stops
# answering the alerts endpoint, which the delta above is written to pass over
# rather than report as a fall to zero. So a board can leave the baseline
# `docs/scanning-baseline.md` declares and the alert leg is deliberately silent
# about it. The baseline leg asks the configuration endpoints instead - the
# board's live visibility, secret scanning, push protection and code scanning -
# decides which of the two baseline rows the board is in from that visibility,
# and names every board short of its own row.
#
# IT READS THE PAGE THAT DECLARES THE BASELINE RATHER THAN CARRYING A COPY OF
# IT. A board that deliberately sits outside its row records the reason in the
# register on that page, and the register entry carries a `Waives:` line naming
# the control. A second list of exceptions inside this file would drift against
# the page silently, which is the same failure the roster is fetched to avoid.
#
# IT REFUSES NOW, AND THIS COMMENT SAID IT DID NOT (iderex/wache#32). What stood
# here was that a board short of its row was named in the run summary and that
# the run's exit code was the alert leg's, because a red run throws away the
# day's alert reading - the artifact is kept on `success()` alone. That reason
# was real and it is answered by ORDER rather than by trading the refusal away:
# the verdict is decided in the judging step, the artifact is uploaded while the
# job is still green, and a LAST step turns a shortfall into a red run after
# both. So the day's reading is kept and the shortfall is refused, which the
# comment above could not have without the extra step.
#
# WHY A REFUSAL AND NOT A NAME. "Staying covered is nobody's job" is what #32 is
# about. A board added to the roster tomorrow gets its scanning settings from
# nothing, and a line in a run summary that nobody is required to read is the
# same as no watch at all. A red run is the only thing here that reaches a
# person.
#
# A FAILED RUN STILL KEEPS NOTHING, and this refusal is not an exception to that.
# The rule exists because a run whose FILING failed halfway would hand the rises
# it did not manage to file to the next run as the baseline they were measured
# against. A configuration shortfall is not a filing failure: the alert leg ran
# to the end and filed what it had, so its reading is exactly the one the next
# run needs. That is why the refusal sits after the upload rather than inside the
# step that decides it.
#
# WHERE THE READING LANDS BEYOND THE RUN (iderex/wache#48). A run's step summary
# is reachable only by knowing the run exists, and the artifact beside it expires
# after ninety days, so the fleet's alert history had a home with an expiry date
# and no index. Every ordinary run now writes the same summary into the body of
# one CLOSED issue on this board, `iderex/wache#67`. Closed is the point of it: a
# permanently open issue is read as work by every count over this board, while a
# closed one still takes an edit, still has a stable number, and keeps every past
# reading in its edit history. The step summary and the register body are one
# composed text used twice, so the two cannot disagree.
name: Fleet alert sweep

on:
  schedule:
    # Daily. A scheduled run fires only from the default branch, may be delayed
    # under load, and is switched off by the platform after sixty days without
    # repository activity. None of the three is something this file can refuse.
    - cron: '45 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Read and report, and write to no tracker'
        type: boolean
        default: true
      boards:
        description: 'Restrict the sweep to these boards, owner/name, comma separated. Empty means the whole roster.'
        type: string
        default: ''
      seed_baseline:
        description: 'PROOF ONLY. A reading in the wire format, used in place of the previous run''s artifact. Tabs written as \t.'
        type: string
        default: ''
      seed_today:
        description: 'PROOF ONLY. A reading in the wire format, used in place of the live one. A seeded run reads no board and keeps no artifact.'
        type: string
        default: ''

permissions:
  contents: read
  actions: read
  # The register issue this sweep writes is on this board, so the token a run
  # here is minted with reaches it and the fleet token is not spent on it.
  issues: write

concurrency:
  # Two sweeps at once would file the same issue twice, which is the one thing
  # this file promises not to do. They queue rather than cancelling: a cancelled
  # sweep keeps no reading, and the next one would compare against a stale day.
  group: fleet-alert-sweep
  cancel-in-progress: false

jobs:
  sweep:
    name: Read every board, raise only what rose
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      # THE BASELINE PAGE IS THE ONE FILE THIS SWEEP READS OUT OF ITS OWN TREE.
      # The register of recorded reasons lives there, and a copy of it in this
      # file would drift against the page nobody would think to re-read.
      - name: Take the tree this sweep reads its own baseline out of
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Judge the fixtures, then the fleet
        env:
          SWEEP_TOKEN: ${{ secrets.FLEET_SWEEP_TOKEN }}
          RUNS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTER_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTER_ISSUE: '67'
          REF_NAME: ${{ github.ref_name }}
          THIS_REPO: ${{ github.repository }}
          THIS_RUN: ${{ github.run_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          WORKFLOW_FILE: fleet-alert-sweep.yml
          ROSTER_REPO: iderex/operations
          ROSTER_PATH: store/repo
          BASELINE_PAGE: docs/scanning-baseline.md
          DRY_RUN: ${{ inputs.dry_run }}
          ONLY_BOARDS: ${{ inputs.boards }}
          SEED_BASELINE: ${{ inputs.seed_baseline }}
          SEED_TODAY: ${{ inputs.seed_today }}
          ISSUE_TITLE: 'Open security alerts rose on this board'
        run: |
          set -euo pipefail

          # ------------------------------------------------------------------
          # The wire format, which is the whole state this sweep keeps.
          #
          #   S <TAB> board <TAB> kind <TAB> state
          #   A <TAB> board <TAB> kind <TAB> rule <TAB> count
          #
          # `state` is `read` or `unread:<reason>`. An `A` line exists only under
          # a `read` state, so a pair that was not read carries no counts and can
          # neither rise nor fall. That is the invariant the comparison rests on,
          # and the fixtures pin it.
          #
          # The baseline leg keeps a second format, in its own file, because it
          # is judged against a declared row rather than against yesterday:
          #
          #   C <TAB> board <TAB> control <TAB> value
          #   W <TAB> board <TAB> control
          #
          # A `C` line is one configuration reading, and its value is either the
          # reading or `unread:<reason>` for the same reason the `S` line carries
          # one - a control that could not be read is not a control that is off.
          # A `W` line is a waiver, extracted from the register on the baseline
          # page rather than declared here.
          # ------------------------------------------------------------------

          # A REASON RATHER THAN A ZERO. Every non-200 becomes a state and the
          # status code survives into it, because 403 and 404 are different facts
          # about a board and folding them loses the one a reader needs.
          state_for() {
            case "$1" in
              200) printf 'read\n' ;;
              *)   printf 'unread:%s\n' "$1" ;;
            esac
          }

          # THE JUDGEMENT, and the only place a decision to raise is taken. It is
          # a pure function of two files so that the fixtures can refuse it.
          #
          # THE FILE IS TOLD APART BY NAME AND NOT BY `FNR == NR`, which is the
          # idiom this was written with and which is wrong for exactly the case
          # that matters most here. `FNR == NR` holds for every record of the
          # second file when the first one is EMPTY, so the very first sweep -
          # no baseline at all - read today's reading as its own baseline and
          # raised nothing, forever, in silence. The fixture below carries that
          # case and refused this function until the comparison moved to
          # `FILENAME`.
          deltas() {
            awk -F'\t' -v basefile="$1" '
              FILENAME == basefile {
                if ($1 == "S") bs[$2 FS $3] = $4
                else if ($1 == "A") bc[$2 FS $3 FS $4] = $5
                next
              }
              $1 == "S" { next }
              $1 == "A" {
                board = $2; kind = $3; rule = $4; now = $5 + 0
                pair = board FS kind
                # A pair read for the first time is recorded, never raised. Every
                # rule on it is new to this file and none is new to the board.
                if (bs[pair] != "read") { first[pair] = 1; next }
                was = bc[board FS kind FS rule] + 0
                if (was == 0) print board "\t" kind "\t" rule "\t0\t" now "\tnew"
                else if (now > was) print board "\t" kind "\t" rule "\t" was "\t" now "\trose"
                next
              }
              END {
                for (p in first) { split(p, a, FS); print a[1] "\t" a[2] "\t-\t-\t-\tfirst-reading" }
              }
            ' "$1" "$2" | LC_ALL=C sort
          }

          # The dedup key is the title, so a title that does not survive a round
          # trip through the tracker would file a second issue every day.
          match_open_issue() {
            jq -r --arg t "$2" '[.[] | select(has("pull_request") | not) | select(.title == $t) | .number] | first // ""' <<< "$1"
          }

          # PAGINATION IS FOLLOWED AND NEVER CONSTRUCTED. This walked the pages
          # by appending `&page=N`, which the code-scanning and secret-scanning
          # endpoints accept and the Dependabot one refuses outright:
          #
          #   {"message":"Pagination using the `page` parameter is not supported."}
          #
          # It answered 400 on 72 of the 73 boards, and 400 is a state rather
          # than a count, so the sweep read the whole fleet's Dependabot alerts
          # as unread and said so in its summary instead of reporting them as
          # zero. That is the reading separation doing its job, and it is also
          # how the defect was found - by running the sweep over the real roster
          # rather than over the three kinds it was written against. Following
          # the `Link` header instead is one route for all three kinds and
          # constructs no cursor of its own.
          #
          # THE PIPELINE ENDS IN `|| true` AND THE FUNCTION IN `return 0`, for
          # the reason the `references` job on this board already carries: the
          # last page has no `Link: rel="next"`, `grep` exits 1 on matching
          # nothing, `set -o pipefail` carries that out, and the caller reads
          # this into a variable - an assignment whose status IS the
          # substitution's. Unguarded, the sweep would die on the last page of
          # the first board it read.
          next_link() {
            tr -d '\r' < "$1" | grep -i '^link:' | tr ',' '\n' |
              sed -n 's/.*<\(https[^>]*\)>; *rel="next".*/\1/p' | head -1 || true
            return 0
          }

          # WHICH RUNS MAY LEAVE A BASELINE BEHIND, AND WHICH MAY BECOME ONE.
          # Two halves of one question (iderex/wache#52), and the file already
          # answered a third of it at the keep step: a seeded run keeps nothing
          # because its reading is an argument to a proof, and a failed run keeps
          # nothing because it would hand the rises it did not manage to file to
          # the next run as the baseline they were measured against.
          #
          # A DRY RUN IS THAT SECOND CASE WITH THE FILING NEVER ATTEMPTED. It
          # reads the whole fleet, reports what rose, writes to no tracker, and
          # kept its reading - so every rise it reported sat inside the next
          # run's baseline and was never raised by anything. The condition is
          # whether the run was ALLOWED to file, not whether it filed: a run
          # where nothing rose files nothing and its reading is exactly the one
          # the next run needs.
          may_keep() {
            # $1 seeded, $2 the dry-run input as it reached the job
            if [ "$1" != "0" ]; then printf '0\n'; return; fi
            if [ "${2:-false}" = "true" ]; then printf '0\n'; return; fi
            printf '1\n'
          }

          # WHICH RUNS MAY WRITE THE REGISTER (iderex/wache#48). Every run that
          # keeps a reading, and no other - a seeded run's reading is an argument
          # to a proof and a dry run's is one it was never allowed to act on, and
          # neither belongs in a permanent register any more than in the next
          # run's baseline. One condition is added on top: the run must be on
          # this board's default branch. A dispatch on a feature branch is a
          # rehearsal of a MODIFIED sweep, and the register is the mainline's
          # permanent state, so a rehearsal that overwrote it would put a reading
          # produced by code that never landed where a later reader takes it for
          # the fleet's own history. That is the same reason the previous reading
          # is only ever read from the default branch.
          may_register() {
            # $1 seeded, $2 the dry-run input, $3 the ref this run is on,
            # $4 this board's default branch
            [ "$(may_keep "$1" "$2")" = "1" ] || { printf '0\n'; return; }
            [ -n "$3" ] && [ "$3" = "$4" ] || { printf '0\n'; return; }
            printf '1\n'
          }

          # WHAT A BASELINE COUNT MEANS FOR THE RUN'S EXIT CODE (iderex/wache#32).
          # Three answers rather than two, because "the leg reached no verdict"
          # and "the leg found nothing" are opposite statements and folding them
          # together is the failure this whole file is written against. A count
          # that is absent, or that is not a number, is NOT a clean fleet: it is
          # a run whose judging step did not get that far, and the step that
          # applies this says so instead of inventing a verdict.
          baseline_refuses() {
            # $1 the number of board-controls short of a row, as the judging
            # step left it
            case "${1:-}" in
              '') printf 'no-verdict\n' ;;
              *[!0-9]*) printf 'no-verdict\n' ;;
              0) printf 'clean\n' ;;
              *) printf 'refuse\n' ;;
            esac
          }

          # AN ISSUE BODY HAS A CEILING AND THE READING DOES NOT. The register is
          # a fleet-wide table, so it grows with the roster and with whatever rose
          # that day, and a PATCH carrying more than the platform accepts is
          # refused whole - which would leave the register holding YESTERDAY's
          # reading while the run reported today's, the one failure a register may
          # not have. So the body is cut to the last whole line that fits and SAYS
          # that it was cut, with the run holding all of it named above the cut.
          # The ceiling is counted in bytes, which is at or above the character
          # count the platform measures, so the cut falls early rather than late.
          clamp() {
            # $1 a file, $2 the ceiling in bytes
            local f=$1 max=$2 n
            n=$(wc -c < "$f" | tr -d ' ')
            if [ "$n" -le "$max" ]; then cat "$f"; return; fi
            head -c "$max" "$f" | sed '$d'
            printf '\n_Cut to fit the body limit of an issue: %s bytes of %s are here. The run named above carries all of it._\n' "$max" "$n"
          }

          # THE OTHER HALF IS WHERE A BASELINE MAY COME FROM. The run history is
          # walked newest-first across every branch, so a run of a MODIFIED sweep
          # on a feature branch could hand its reading to the mainline schedule -
          # a comparison the mainline never made, against code that never landed.
          # The query is restricted to the default branch instead, which also
          # leaves a branch run reading the mainline baseline, which is what
          # makes a dispatch on a branch a fair rehearsal rather than a fork of
          # the state.
          runs_url() {
            printf 'https://api.github.com/repos/%s/actions/workflows/%s/runs?status=success&branch=%s&per_page=50\n' "$1" "$2" "$3"
          }

          # THE REGISTER IS READ OUT OF THE PAGE THAT DECLARES THE BASELINE, so
          # a recorded reason has one home and not two. An entry is a heading
          # naming its boards in backticks and carrying a `Waives:` line; a
          # heading with no `Waives:` line waives nothing, which is what keeps
          # the page's ordinary prose headings - and its expired entries - out
          # of the register.
          #
          # A HEADING NAMING SEVERAL BOARDS WAIVES FOR ALL OF THEM rather than
          # for the first. Taking the first backticked name would have read the
          # page's own three-board heading as a waiver for one board and silence
          # for two, which is the shape that is wrong in the direction nobody
          # notices.
          waivers_from() {
            awk '
              /^##+ / {
                n = 0
                line = $0
                while (match(line, /`[^`]+`/)) {
                  nm = substr(line, RSTART + 1, RLENGTH - 2)
                  if (nm ~ /^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/) { n++; names[n] = nm }
                  line = substr(line, RSTART + RLENGTH)
                }
                next
              }
              /^Waives:[ \t]/ {
                spec = $0
                sub(/^Waives:[ \t]*/, "", spec)
                gsub(/[ \t]/, "", spec)
                c = split(spec, ctrl, ",")
                if (n == 0) { for (j = 1; j <= c; j++) print "W\t-\t" ctrl[j]; next }
                for (i = 1; i <= n; i++) for (j = 1; j <= c; j++) print "W\t" names[i] "\t" ctrl[j]
              }
            ' "$1" | LC_ALL=C sort -u
          }

          # THE REGISTER FAILS CLOSED IN BOTH DIRECTIONS. A control this leg does
          # not judge is a waiver that silently holds nothing out, and a `Waives:`
          # line under a heading naming no board is a waiver with no subject.
          # Both refuse the run rather than being skipped, because a register
          # nobody can trust is worse than none.
          unknown_controls() {
            awk -F'\t' '$1 == "W" {
              if ($3 != "code-scanning" && $3 != "secret-scanning" &&
                  $3 != "push-protection" && $3 != "dependabot-alerts") print $3
            }' "$1" | LC_ALL=C sort -u
          }

          boardless_waivers() {
            awk -F'\t' '$1 == "W" && $2 == "-" { print $3 }' "$1" | LC_ALL=C sort -u
          }

          # THE ROW JUDGEMENT, and like the delta above it is a pure function of
          # files so the fixtures can refuse it before it judges a fleet.
          #
          # WHICH ROW A BOARD IS IN IS ITS LIVE VISIBILITY AND NOT ITS ROSTER
          # RECORD. The page says a private board that goes public crosses into
          # the public row on the day its visibility changes, so reading the row
          # off the record would hold a board in the row it used to be in. The
          # record is still read, and a disagreement between the two is named -
          # a board that crossed rows with nobody writing it down is exactly what
          # this issue is about.
          #
          # A WAIVER IS SPENT OR IT IS NAMED. A recorded reason for a control the
          # board now satisfies is stale, and a register that keeps silent about
          # its own stale entries is read as a live one. So the control is judged
          # FIRST and the waiver applied to the verdict, rather than the waiver
          # being checked first and the reading never taken.
          rows() {
            awk -F'\t' -v conf="$1" -v waiv="$2" '
              function judge(b, c, value, want,   key, ok) {
                key = b SUBSEP c
                ok = (value == want)
                if (key in w) {
                  used[key] = 1
                  if (ok) print b "\t" c "\tstale-waiver\t" value ", which is what the row asks for"
                  else print b "\t" c "\twaived\t" value
                  return
                }
                if (ok) return
                if (value ~ /^unread/) { print b "\t" c "\tunjudged\t" value; return }
                print b "\t" c "\tshort\t" value ", where the row asks for " want
              }
              FILENAME == conf && $1 == "C" { v[$2 SUBSEP $3] = $4; board[$2] = 1; next }
              FILENAME == waiv && $1 == "W" { w[$2 SUBSEP $3] = 1; next }
              END {
                for (b in board) {
                  vis = v[b SUBSEP "visibility"]
                  if (vis == "") vis = "unread:no-line"
                  if (vis ~ /^unread/) {
                    print b "\t-\tunjudged\tvisibility " vis ", and the row a board is in cannot be decided without it"
                    continue
                  }
                  if (v[b SUBSEP "archived"] == "true") {
                    print b "\t-\tarchived\tno setting on it can be changed, so it is named rather than judged"
                    continue
                  }
                  rv = v[b SUBSEP "roster-visibility"]
                  if (rv != "" && rv != "absent" && rv != vis)
                    print b "\t-\tcrossed-rows\tthe roster record declares " rv " and the board is " vis
                  # DEPENDABOT STANDS IN BOTH ROWS, and it is read on its own
                  # endpoint rather than off the state the alert leg keeps. That is
                  # `unread:<code>` for a board with the feature off AND for a
                  # board the token cannot reach, and folding those two together
                  # is the error this whole file is written against.
                  judge(b, "dependabot-alerts", v[b SUBSEP "dependabot-alerts"], "enabled")
                  # The private row is Dependabot and the local gate. It asks for
                  # neither Advanced Security feature, so a private board
                  # reporting both off is AT its baseline and is named nowhere.
                  if (vis != "public") continue
                  judge(b, "secret-scanning", v[b SUBSEP "secret-scanning"], "enabled")
                  judge(b, "push-protection", v[b SUBSEP "push-protection"], "enabled")
                  # CODE SCANNING HAS TWO CONFIGURATIONS AND EITHER SATISFIES THE
                  # ROW. Default setup answers its own endpoint; advanced setup
                  # does not, and reports `not-configured` there while the board
                  # scans perfectly well from a workflow of its own. Judging on
                  # the endpoint alone would name every advanced-setup board.
                  cs = b SUBSEP "code-scanning"
                  setup = v[b SUBSEP "code-scanning-setup"]
                  wf = v[b SUBSEP "code-scanning-workflow"]
                  scanned = (setup == "configured" || wf == "present")
                  if (cs in w) {
                    used[cs] = 1
                    if (scanned) print b "\tcode-scanning\tstale-waiver\tdefault setup " setup ", workflow " wf ", which is what the row asks for"
                    else print b "\tcode-scanning\twaived\tdefault setup " setup ", workflow " wf
                    continue
                  }
                  if (scanned) continue
                  if (setup ~ /^unread/ && wf ~ /^unread/) {
                    print b "\tcode-scanning\tunjudged\tdefault setup " setup " and the workflow reading " wf
                    continue
                  }
                  print b "\tcode-scanning\tshort\tdefault setup reports " setup " and no workflow present today calls github/codeql-action, so any analysis this board holds is a reading of the past"
                }
                for (k in w) {
                  if (k in used) continue
                  split(k, a, SUBSEP)
                  if (a[1] in board) print a[1] "\t" a[2] "\tunused-waiver\tthe board was judged and this control was not among what it was judged on"
                  else print a[1] "\t" a[2] "\toutside-the-population\tno board this run swept carries that name"
                }
              }
            ' "$1" "$2" | LC_ALL=C sort
          }

          # ------------------------------------------------------------------
          # Fixtures. Every rule gets a line that bites and a line that passes.
          # ------------------------------------------------------------------
          self_test=0
          same() {
            if [ "$2" = "$3" ]; then
              echo "fixture ok     $1"
            else
              echo "FIXTURE FAILED $1: wanted [$3], got [$2]"
              self_test=1
            fi
          }

          fx=$(mktemp -d)
          judged() { deltas "$fx/base" "$fx/today"; }

          same "a 200 is a reading" "$(state_for 200)" "read"
          same "a 404 is not a zero" "$(state_for 404)" "unread:404"
          same "a 403 keeps its own code" "$(state_for 403)" "unread:403"
          same "a request that never answered keeps its own code" "$(state_for 000)" "unread:000"

          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t3\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t3\nA\tiderex/a\tcode-scanning\tr2\t1\n' > "$fx/today"
          same "a rule id the previous reading did not hold is raised" \
               "$(judged)" \
               "$(printf 'iderex/a\tcode-scanning\tr2\t0\t1\tnew')"

          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t3\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t5\n' > "$fx/today"
          same "a count that rose is raised, with both ends of the move" \
               "$(judged)" \
               "$(printf 'iderex/a\tcode-scanning\tr1\t3\t5\trose')"

          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t5\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t3\n' > "$fx/today"
          same "a count that fell is not an issue" "$(judged)" ""

          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t5\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t5\n' > "$fx/today"
          same "a count that stood still is not an issue" "$(judged)" ""

          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t5\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\n' > "$fx/today"
          same "a rule that has gone is not an issue" "$(judged)" ""

          # THE FLOOD CASE. A board read today and unread yesterday would look
          # like every one of its rules arriving at once.
          printf 'S\tiderex/a\tcode-scanning\tunread:404\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t9\nA\tiderex/a\tcode-scanning\tr2\t4\n' > "$fx/today"
          same "a pair read for the first time is recorded, not raised" \
               "$(judged)" \
               "$(printf 'iderex/a\tcode-scanning\t-\t-\t-\tfirst-reading')"

          printf '' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t9\n' > "$fx/today"
          same "a board the previous reading never held is a first reading" \
               "$(judged)" \
               "$(printf 'iderex/a\tcode-scanning\t-\t-\t-\tfirst-reading')"

          # THE OTHER DIRECTION OF THE SAME TRAP. A board that stopped being
          # readable must not read as a fall to zero.
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t9\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tunread:403\n' > "$fx/today"
          same "a pair that stopped being readable raises nothing" "$(judged)" ""

          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t1\n' > "$fx/base"
          printf 'S\tiderex/a\tcode-scanning\tread\nA\tiderex/a\tcode-scanning\tr1\t2\nS\tiderex/b\tdependabot\tread\nA\tiderex/b\tdependabot\tGHSA-x\t1\n' > "$fx/today"
          same "one board rising does not carry another board's first reading" \
               "$(judged)" \
               "$(printf 'iderex/a\tcode-scanning\tr1\t1\t2\trose\niderex/b\tdependabot\t-\t-\t-\tfirst-reading')"

          same "an open issue with that title is found" \
               "$(match_open_issue '[{"number":7,"title":"Open security alerts rose on this board"}]' 'Open security alerts rose on this board')" \
               "7"
          same "a pull request with the same title is not an issue" \
               "$(match_open_issue '[{"number":7,"title":"Open security alerts rose on this board","pull_request":{}}]' 'Open security alerts rose on this board')" \
               ""
          same "a different title is not a match" \
               "$(match_open_issue '[{"number":7,"title":"Something else"}]' 'Open security alerts rose on this board')" \
               ""

          printf 'HTTP/2 200\r\nlink: <https://api.github.com/x?after=AAA>; rel="next", <https://api.github.com/x?after=ZZZ>; rel="last"\r\n\r\n' > "$fx/h1"
          same "the next page is taken from the header and not built" \
               "$(next_link "$fx/h1")" \
               "https://api.github.com/x?after=AAA"
          printf 'HTTP/2 200\r\nlink: <https://api.github.com/x?before=AAA>; rel="prev", <https://api.github.com/x?page=1>; rel="first"\r\n\r\n' > "$fx/h2"
          same "a header carrying every relation but next ends the walk" \
               "$(next_link "$fx/h2")" \
               ""
          printf 'HTTP/2 200\r\ncontent-type: application/json\r\n\r\n' > "$fx/h3"
          same "a response with no link header ends the walk" \
               "$(next_link "$fx/h3")" \
               ""

          # -------- which run keeps a reading, and whose it may read --------
          same "an ordinary run keeps its reading" "$(may_keep 0 false)" "1"
          same "a run with no dry-run input at all keeps its reading" "$(may_keep 0 '')" "1"
          same "a dry run keeps nothing, because it was never allowed to file" "$(may_keep 0 true)" "0"
          same "a seeded run keeps nothing" "$(may_keep 1 false)" "0"
          same "a seeded dry run keeps nothing either" "$(may_keep 1 true)" "0"

          # -------- which run may write the register --------
          same "an ordinary run on the default branch writes the register" \
               "$(may_register 0 false main main)" "1"
          same "the same run on a feature branch writes nothing" \
               "$(may_register 0 false feat/x main)" "0"
          same "a dry run on the default branch writes nothing" \
               "$(may_register 0 true main main)" "0"
          same "a seeded run on the default branch writes nothing" \
               "$(may_register 1 false main main)" "0"
          same "a run that cannot tell which ref it is on writes nothing" \
               "$(may_register 0 false '' main)" "0"
          same "a run that cannot tell its default branch writes nothing" \
               "$(may_register 0 false main '')" "0"

          # -------- what a baseline count does to the exit code --------
          same "no board short of a row is a clean run" "$(baseline_refuses 0)" "clean"
          same "one board-control short reds the run"   "$(baseline_refuses 1)" "refuse"
          same "thirty-six short red it too"            "$(baseline_refuses 36)" "refuse"
          same "an absent count is not a clean fleet"   "$(baseline_refuses '')" "no-verdict"
          same "a count that is not a number is not one either" "$(baseline_refuses 'x')" "no-verdict"
          same "a count with a number inside it is not one" "$(baseline_refuses '1 board')" "no-verdict"

          # -------- the ceiling on a body --------
          printf 'aaa\nbbb\nccc\n' > "$fx/body"
          same "a reading under the ceiling is written whole" \
               "$(clamp "$fx/body" 100)" "$(printf 'aaa\nbbb\nccc')"
          same "a reading over the ceiling loses the line that did not fit" \
               "$(clamp "$fx/body" 9 | grep -v '^_')" "$(printf 'aaa\nbbb')"
          same "a cut reading says it was cut rather than ending silently" \
               "$(clamp "$fx/body" 9 | grep -c 'Cut to fit')" "1"
          same "the previous reading is looked for on the default branch alone" \
               "$(runs_url iderex/wache fleet-alert-sweep.yml main)" \
               "https://api.github.com/repos/iderex/wache/actions/workflows/fleet-alert-sweep.yml/runs?status=success&branch=main&per_page=50"

          # -------- the baseline row leg --------
          rowed() { rows "$fx/conf" "$fx/waiv"; }
          : > "$fx/waiv"
          in_row() {
            printf 'C\tiderex/a\tvisibility\tpublic\nC\tiderex/a\tarchived\tfalse\nC\tiderex/a\troster-visibility\tpublic\nC\tiderex/a\tdependabot-alerts\tenabled\nC\tiderex/a\tsecret-scanning\tenabled\nC\tiderex/a\tpush-protection\tenabled\nC\tiderex/a\tcode-scanning-setup\tconfigured\nC\tiderex/a\tcode-scanning-workflow\tnone-named\n' > "$fx/conf"
          }

          in_row
          same "a public board at every control of its row is named nowhere" "$(rowed)" ""

          in_row; sed -i 's/secret-scanning\tenabled/secret-scanning\tdisabled/' "$fx/conf"
          same "a public board with secret scanning off is named" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tsecret-scanning\tshort')"

          in_row; sed -i 's/push-protection\tenabled/push-protection\tdisabled/' "$fx/conf"
          same "a public board with push protection off is named" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tpush-protection\tshort')"

          # THE CASE THIS LEG EXISTS FOR. Code scanning goes off, the alerts
          # endpoint stops answering, and the delta above is written to say
          # nothing about it.
          in_row; sed -i 's/code-scanning-setup\tconfigured/code-scanning-setup\tnot-configured/' "$fx/conf"
          same "a public board whose code scanning is configured neither way is named" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tcode-scanning\tshort')"

          in_row
          sed -i 's/code-scanning-setup\tconfigured/code-scanning-setup\tnot-configured/' "$fx/conf"
          sed -i 's/code-scanning-workflow\tnone-named/code-scanning-workflow\tpresent/' "$fx/conf"
          same "an advanced setup satisfies the row where the default-setup endpoint reports nothing" \
               "$(rowed)" ""

          in_row
          sed -i 's/code-scanning-setup\tconfigured/code-scanning-setup\tunread:403/' "$fx/conf"
          sed -i 's/code-scanning-workflow\tnone-named/code-scanning-workflow\tunread:403/' "$fx/conf"
          same "a code scanning reading that did not answer is unjudged and not a shortfall" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tcode-scanning\tunjudged')"

          # THE PRIVATE ROW IS NOT THE PUBLIC ROW WITH THINGS MISSING. A private
          # board reporting both Advanced Security features off is at its
          # baseline, and naming it would open a finding on thirty-eight boards
          # that are exactly where the baseline puts them.
          printf 'C\tiderex/a\tvisibility\tprivate\nC\tiderex/a\tarchived\tfalse\nC\tiderex/a\troster-visibility\tprivate\nC\tiderex/a\tdependabot-alerts\tenabled\nC\tiderex/a\tsecret-scanning\tnot-reported\nC\tiderex/a\tpush-protection\tnot-reported\n' > "$fx/conf"
          same "a private board with neither Advanced Security feature is at its baseline" "$(rowed)" ""

          in_row; sed -i 's/roster-visibility\tpublic/roster-visibility\tprivate/' "$fx/conf"
          same "a board that crossed rows with nobody recording it is named" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\t-\tcrossed-rows')"

          in_row; sed -i 's/roster-visibility\tpublic/roster-visibility\tabsent/' "$fx/conf"
          same "a roster record declaring no visibility is compared against nothing" "$(rowed)" ""

          printf 'C\tiderex/a\tvisibility\tunread:403\n' > "$fx/conf"
          same "a board whose visibility did not answer is unjudged rather than clean" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\t-\tunjudged')"

          in_row; sed -i 's/archived\tfalse/archived\ttrue/' "$fx/conf"
          same "an archived board is named as archived and judged against no row" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\t-\tarchived')"

          in_row; sed -i 's/dependabot-alerts\tenabled/dependabot-alerts\tdisabled/' "$fx/conf"
          same "Dependabot alerts off is a shortfall in the public row" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tdependabot-alerts\tshort')"

          printf 'C\tiderex/a\tvisibility\tprivate\nC\tiderex/a\tarchived\tfalse\nC\tiderex/a\troster-visibility\tprivate\nC\tiderex/a\tdependabot-alerts\tdisabled\n' > "$fx/conf"
          same "Dependabot alerts off is a shortfall in the private row too" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tdependabot-alerts\tshort')"

          # THE WAIVER, IN THREE DIRECTIONS: it holds a shortfall out, it is
          # named when the shortfall it was written for has gone, and it is named
          # when it holds nothing out at all.
          in_row; sed -i 's/secret-scanning\tenabled/secret-scanning\tdisabled/' "$fx/conf"
          printf 'W\tiderex/a\tsecret-scanning\n' > "$fx/waiv"
          same "a recorded reason turns a shortfall into a waived reading" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tsecret-scanning\twaived')"

          in_row
          same "a waiver for a control the board now satisfies is named as stale" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tsecret-scanning\tstale-waiver')"

          printf 'W\tiderex/a\tcode-scanning\n' > "$fx/waiv"
          in_row; sed -i 's/code-scanning-setup\tconfigured/code-scanning-setup\tnot-configured/' "$fx/conf"
          same "a waived code scanning shortfall is held out" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tcode-scanning\twaived')"
          in_row
          same "a code scanning waiver on a board that scans is named as stale" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tcode-scanning\tstale-waiver')"

          printf 'W\tiderex/a\tsecret-scanning\n' > "$fx/waiv"
          printf 'C\tiderex/a\tvisibility\tprivate\nC\tiderex/a\tarchived\tfalse\nC\tiderex/a\troster-visibility\tprivate\nC\tiderex/a\tdependabot-alerts\tenabled\n' > "$fx/conf"
          same "a waiver on a control the board's row never asks for is named as unused" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/a\tsecret-scanning\tunused-waiver')"

          printf 'W\tiderex/elsewhere\tcode-scanning\n' > "$fx/waiv"
          in_row
          same "a waiver for a board outside the swept population says so" \
               "$(rowed | cut -f1-3)" \
               "$(printf 'iderex/elsewhere\tcode-scanning\toutside-the-population')"
          : > "$fx/waiv"

          # THE REGISTER READER.
          printf '### `iderex/a` - a reason\n\nReason: something.\nWaives: code-scanning\nExpires when: never.\n' > "$fx/page"
          same "an entry naming one board and one control is a waiver" \
               "$(waivers_from "$fx/page")" \
               "$(printf 'W\tiderex/a\tcode-scanning')"

          printf '### `iderex/a`, `iderex/b` - one reason for two boards\n\nWaives: code-scanning, secret-scanning\n' > "$fx/page"
          same "an entry naming two boards and two controls waives all four" \
               "$(waivers_from "$fx/page")" \
               "$(printf 'W\tiderex/a\tcode-scanning\nW\tiderex/a\tsecret-scanning\nW\tiderex/b\tcode-scanning\nW\tiderex/b\tsecret-scanning')"

          printf '## The private boards - the baseline, not an exception\n\nNothing is recorded here for them.\n\n### `iderex/a`, `iderex/b`, `iderex/c` - the entry that expired\n\nAll three now carry analyses.\n' > "$fx/page"
          same "a heading with no Waives line waives nothing, expired entries included" \
               "$(waivers_from "$fx/page")" ""

          printf '### A heading naming a `path/in/backticks` and no board\n\nWaives: code-scanning\n' > "$fx/page"
          same "a Waives line under a heading naming no board keeps no subject" \
               "$(waivers_from "$fx/page")" \
               "$(printf 'W\t-\tcode-scanning')"
          same "a waiver with no subject is refused" \
               "$(boardless_waivers <(waivers_from "$fx/page"))" \
               "code-scanning"
          same "a waiver with a subject is not refused for having none" \
               "$(printf 'W\tiderex/a\tcode-scanning\n' > "$fx/w1"; boardless_waivers "$fx/w1")" ""

          printf 'W\tiderex/a\tzizmor\n' > "$fx/w1"
          same "a waiver naming a control this leg does not judge is refused" \
               "$(unknown_controls "$fx/w1")" "zizmor"
          printf 'W\tiderex/a\tcode-scanning\nW\tiderex/a\tsecret-scanning\nW\tiderex/a\tpush-protection\nW\tiderex/a\tdependabot-alerts\n' > "$fx/w1"
          same "every control the leg judges is accepted by name" \
               "$(unknown_controls "$fx/w1")" ""

          if [ "$self_test" != "0" ]; then
            echo "::error::the fixtures failed, so this run judges nothing"
            exit 1
          fi
          echo "---- fixtures pass; the sweep may now judge ----"

          # ------------------------------------------------------------------
          # The live reading.
          # ------------------------------------------------------------------
          body=$(mktemp)
          hdrs=$(mktemp)
          req() {
            # $1 method, $2 url, $3 token, $4 optional payload file. Prints the
            # status, leaves the body in $body and the response headers in
            # $hdrs. It never dies, so a refusal is a state this script judges
            # rather than a step that vanished.
            local m=$1 url=$2 tok=$3 payload=${4:-} code
            if [ -n "$payload" ]; then
              code=$(curl -sS -m 45 -o "$body" -D "$hdrs" -w '%{http_code}' -X "$m" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $tok" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                --data-binary "@$payload" "$url") || code=000
            else
              code=$(curl -sS -m 45 -o "$body" -D "$hdrs" -w '%{http_code}' -X "$m" \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $tok" \
                -H "X-GitHub-Api-Version: 2022-11-28" "$url") || code=000
            fi
            printf '%s' "$code"
          }

          if [ -z "${SWEEP_TOKEN:-}" ]; then
            echo "::error::no FLEET_SWEEP_TOKEN reached this job. This sweep reads other boards' security alerts and files issues on them, and neither is reachable with the token a run here is minted with. Refusing rather than reporting a fleet it could not read."
            exit 1
          fi

          today=$(mktemp)
          baseline=$(mktemp)
          config=$(mktemp)
          waivers=$(mktemp)
          : > "$config"

          # -------- the register, read before anything is swept --------
          # It is a tree read and it refuses, so it fails before 73 boards are
          # asked anything rather than after.
          if [ ! -f "$BASELINE_PAGE" ]; then
            echo "::error::$BASELINE_PAGE is not in this checkout, so the baseline this sweep judges against and the register of recorded reasons are both unreadable. Refusing rather than judging every board against a row it read nowhere."
            exit 1
          fi
          waivers_from "$BASELINE_PAGE" > "$waivers"
          bad=$(unknown_controls "$waivers")
          if [ -n "$bad" ]; then
            echo "::error::the register in $BASELINE_PAGE waives control(s) this leg does not judge: $(printf '%s' "$bad" | tr '\n' ' '). A waiver against a control nothing reads holds nothing out while reading as though it did."
            exit 1
          fi
          bad=$(boardless_waivers "$waivers")
          if [ -n "$bad" ]; then
            echo "::error::the register in $BASELINE_PAGE carries a Waives: line under a heading that names no board, for control(s): $(printf '%s' "$bad" | tr '\n' ' '). A waiver with no subject cannot be held against anything."
            exit 1
          fi
          echo "register: $(grep -c . "$waivers" || true) waiver(s) read from $BASELINE_PAGE"
          # THE ROSTER IS ACCUMULATED IN A FILE AND NOT IN A VARIABLE. Appending
          # with `v=$(printf '%s...' "$v" ...)` drops the trailing newline on
          # every round, because that is what command substitution does, so the
          # second board is glued to the first and the sweep addresses one repo
          # named after two. It did, on the first local run of this loop.
          boardsfile=$(mktemp)
          : > "$today"
          : > "$baseline"
          : > "$boardsfile"
          seeded=0
          if [ -n "${SEED_TODAY:-}" ]; then
            seeded=1
            printf '%s\n' "$SEED_TODAY" | sed -e 's/\\t/\t/g' | grep -v '^$' > "$today" || true
            printf '%s\n' "${SEED_BASELINE:-}" | sed -e 's/\\t/\t/g' | grep -v '^$' > "$baseline" || true
            echo "SEEDED RUN. No board is read and no reading is kept. $(wc -l < "$today") line(s) of today against $(wc -l < "$baseline") line(s) of baseline."
          fi

          if [ "$seeded" = "0" ]; then
            # -------- the roster --------
            code=$(req GET "https://api.github.com/repos/$ROSTER_REPO/contents/$ROSTER_PATH" "$SWEEP_TOKEN")
            if [ "$code" != "200" ]; then
              echo "::error::the roster at $ROSTER_REPO/$ROSTER_PATH answered $code, so the population of this sweep is unknown. Refusing rather than sweeping whatever subset happened to be reachable."
              head -c 400 "$body"; echo
              exit 1
            fi
            records=$(jq -r '.[] | select(.type == "file") | select(.name | endswith(".md")) | select(.name != "README.md") | .path' < "$body")
            while IFS= read -r rec; do
              [ -n "$rec" ] || continue
              c=$(curl -sS -m 45 -o "$body" -w '%{http_code}' \
                    -H "Accept: application/vnd.github.raw" \
                    -H "Authorization: Bearer $SWEEP_TOKEN" \
                    -H "X-GitHub-Api-Version: 2022-11-28" \
                    "https://api.github.com/repos/$ROSTER_REPO/contents/$rec") || c=000
              if [ "$c" != "200" ]; then
                echo "::error::the roster record $rec answered $c, so the population is incomplete. Refusing."
                exit 1
              fi
              owner=$(grep -m1 '^Owner: ' "$body" | sed 's/^Owner: //' | tr -d '\r' || true)
              name=$(grep -m1 '^Id: ' "$body" | sed 's/^Id: //' | tr -d '\r' || true)
              writer=$(grep -m1 '^Writers: ' "$body" | sed 's/^Writers: //' | tr -d '\r' | cut -d, -f1 || true)
              # THE RECORD'S OWN VISIBILITY IS CARRIED AND NEVER USED AS THE ROW.
              # It is the register's claim about the board, and the baseline leg
              # compares it against what the board reports rather than trusting
              # either. A record that declares none is `absent` and is compared
              # against nothing.
              rvis=$(grep -m1 '^Visibility: ' "$body" | sed 's/^Visibility: //' | tr -d '\r' || true)
              if [ -z "$owner" ] || [ -z "$name" ]; then
                echo "::error::the roster record $rec declares no Owner or no Id, so the board it names cannot be addressed. Refusing."
                exit 1
              fi
              printf '%s/%s\t%s\t%s\n' "$owner" "$name" "${writer:-$owner}" "${rvis:-absent}" >> "$boardsfile"
            done <<< "$records"
            echo "roster: $(grep -c . "$boardsfile") board(s) read from $ROSTER_REPO/$ROSTER_PATH"

            if [ -n "${ONLY_BOARDS:-}" ]; then
              keep=$(printf '%s' "$ONLY_BOARDS" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | grep -v '^$')
              kept=$(mktemp)
              awk -F'\t' -v k="$keep" '
                BEGIN { n = split(k, a, "\n"); for (i = 1; i <= n; i++) want[a[i]] = 1 }
                $1 in want' "$boardsfile" > "$kept"
              mv "$kept" "$boardsfile"
              echo "restricted to $(grep -c . "$boardsfile") board(s) by the boards input"
              if [ ! -s "$boardsfile" ]; then
                echo "::error::the boards input named nothing the roster holds, so this run would sweep an empty population and report a quiet fleet. Refusing."
                exit 1
              fi
            fi

            # -------- the alerts, and the configuration beside them --------
            unread_pairs=0
            while IFS=$'\t' read -r board writer rvis; do
              [ -n "$board" ] || continue
              for kind in code-scanning dependabot secret-scanning; do
                pages=0
                st=""
                url="https://api.github.com/repos/$board/$kind/alerts?state=open&per_page=100"
                counts=$(mktemp)
                : > "$counts"
                while [ -n "$url" ]; do
                  c=$(req GET "$url" "$SWEEP_TOKEN")
                  st=$(state_for "$c")
                  [ "$st" = "read" ] || break
                  case "$kind" in
                    code-scanning)   jq -r '.[] | (.rule.id // "unnamed-rule")' < "$body" >> "$counts" ;;
                    dependabot)      jq -r '.[] | (.security_advisory.ghsa_id // "unnamed-advisory")' < "$body" >> "$counts" ;;
                    secret-scanning) jq -r '.[] | (.secret_type // "unnamed-secret-type")' < "$body" >> "$counts" ;;
                  esac
                  url=$(next_link "$hdrs")
                  pages=$((pages + 1))
                  # A TRUNCATED READING IS NOT A READING. Stopping at a cap and
                  # keeping the counts would report the tail as having fallen.
                  if [ "$pages" -gt 20 ] && [ -n "$url" ]; then
                    st="unread:truncated-above-2000"
                    break
                  fi
                done
                printf 'S\t%s\t%s\t%s\n' "$board" "$kind" "$st" >> "$today"
                if [ "$st" = "read" ]; then
                  LC_ALL=C sort "$counts" | uniq -c |
                    awk -v b="$board" -v k="$kind" '{ c = $1; $1 = ""; sub(/^ /, ""); print "A\t" b "\t" k "\t" $0 "\t" c }' >> "$today"
                else
                  unread_pairs=$((unread_pairs + 1))
                fi
                rm -f "$counts"
              done

              # -------- the configuration this board is in --------
              printf 'C\t%s\troster-visibility\t%s\n' "$board" "${rvis:-absent}" >> "$config"
              c=$(req GET "https://api.github.com/repos/$board" "$SWEEP_TOKEN")
              if [ "$c" = "200" ]; then
                vis=$(jq -r '.visibility' < "$body")
                arch=$(jq -r '.archived | tostring' < "$body")
                # `security_and_analysis` is absent on a board the token cannot
                # see the settings of, and `not-reported` is that absence rather
                # than a feature that is off. On the public row it is short of
                # `enabled` either way, and the detail says which it was.
                ss=$(jq -r '.security_and_analysis.secret_scanning.status // "not-reported"' < "$body")
                pp=$(jq -r '.security_and_analysis.secret_scanning_push_protection.status // "not-reported"' < "$body")
              else
                vis=$(state_for "$c"); arch="$vis"; ss="$vis"; pp="$vis"
              fi
              printf 'C\t%s\tvisibility\t%s\nC\t%s\tarchived\t%s\nC\t%s\tsecret-scanning\t%s\nC\t%s\tpush-protection\t%s\n' \
                     "$board" "$vis" "$board" "$arch" "$board" "$ss" "$board" "$pp" >> "$config"

              # DEPENDABOT IS ASKED ON THE ENDPOINT THAT ANSWERS YES OR NO. The
              # alerts endpoint the leg above walks refuses a board with the
              # feature off and a board the token cannot reach with codes that do
              # not separate the two, and `security_and_analysis` does not carry
              # the alert switch at all. This one is documented to answer 204
              # when vulnerability alerts are enabled and 404 when they are not.
              c=$(req GET "https://api.github.com/repos/$board/vulnerability-alerts" "$SWEEP_TOKEN")
              case "$c" in
                204) da=enabled ;;
                404) da=disabled ;;
                *)   da=$(state_for "$c") ;;
              esac
              printf 'C\t%s\tdependabot-alerts\t%s\n' "$board" "$da" >> "$config"

              # CODE SCANNING IS ASKED FOR ONLY WHERE A ROW ASKS FOR IT. The
              # private row asks for neither Advanced Security feature, so
              # reading them there would spend 39 requests to record a state no
              # rule judges.
              if [ "$vis" = "public" ] && [ "$arch" != "true" ]; then
                c=$(req GET "https://api.github.com/repos/$board/code-scanning/default-setup" "$SWEEP_TOKEN")
                if [ "$c" = "200" ]; then setup=$(jq -r '.state' < "$body"); else setup=$(state_for "$c"); fi

                # THE WORKFLOW IS FOUND THROUGH AN ANALYSIS AND THEN READ IN THE
                # PRESENT. An advanced setup reports `not-configured` on the
                # endpoint above and scans anyway, so the endpoint alone would
                # name every board that configures CodeQL its own way. The
                # analysis names the workflow that produced it, which is the
                # past; whether that file is on the board today, and still calls
                # `github/codeql-action`, is the present, and only the second one
                # decides the row.
                wf="none-named"
                c=$(req GET "https://api.github.com/repos/$board/code-scanning/analyses?per_page=30" "$SWEEP_TOKEN")
                if [ "$c" != "200" ]; then
                  wf=$(state_for "$c")
                else
                  key=$(jq -r '[.[] | .analysis_key | select(startswith(".github/workflows/"))] | first // ""' < "$body")
                  if [ -n "$key" ]; then
                    wpath=${key%%:*}
                    c=$(req GET "https://api.github.com/repos/$board/contents/$wpath" "$SWEEP_TOKEN")
                    if [ "$c" != "200" ]; then
                      wf="absent"
                    elif jq -r '.content // ""' < "$body" | tr -d '\n' | base64 -d 2>/dev/null | grep -q 'github/codeql-action'; then
                      wf="present"
                    else
                      wf="absent"
                    fi
                  fi
                fi
                printf 'C\t%s\tcode-scanning-setup\t%s\nC\t%s\tcode-scanning-workflow\t%s\n' \
                       "$board" "$setup" "$board" "$wf" >> "$config"
              fi
            done < "$boardsfile"
            echo "reading: $(grep -c '^A' "$today" || true) rule line(s) over $(grep -c '^S' "$today" || true) pair(s), $unread_pairs of them unread"
            echo "configuration: $(grep -c '^C' "$config" || true) control reading(s)"

            # -------- the previous reading --------
            # THE DEFAULT BRANCH IS READ AND NEVER ASSUMED TO BE `main`. Every
            # board here uses that name and this one is about not carrying a
            # copy of a fact somewhere else holds.
            if [ -z "${DEFAULT_BRANCH:-}" ]; then
              c=$(req GET "https://api.github.com/repos/$THIS_REPO" "$RUNS_TOKEN")
              [ "$c" = "200" ] && DEFAULT_BRANCH=$(jq -r '.default_branch // ""' < "$body")
            fi
            if [ -z "${DEFAULT_BRANCH:-}" ]; then
              echo "::error::the default branch of $THIS_REPO could not be read, so which runs may leave a baseline cannot be decided. Refusing rather than falling back to the whole run history, which is what this restriction exists against."
              exit 1
            fi
            prev_run=""
            c=$(req GET "$(runs_url "$THIS_REPO" "$WORKFLOW_FILE" "$DEFAULT_BRANCH")" "$RUNS_TOKEN")
            if [ "$c" != "200" ]; then
              c=$(req GET "$(runs_url "$THIS_REPO" "$WORKFLOW_FILE" "$DEFAULT_BRANCH")" "$SWEEP_TOKEN")
            fi
            if [ "$c" != "200" ]; then
              echo "::error::the run history of this workflow answered $c, so the previous reading cannot be reached. A sweep that cannot read its own baseline reports every rule as first-seen forever, which is silence wearing the clothes of a clean fleet. Refusing."
              exit 1
            fi
            runs=$(jq -r --arg me "$THIS_RUN" '[.workflow_runs[] | select((.id | tostring) != $me) | .id] | .[]' < "$body" || true)
            art_url=""
            while IFS= read -r rid; do
              [ -n "$rid" ] || continue
              c=$(req GET "https://api.github.com/repos/$THIS_REPO/actions/runs/$rid/artifacts" "$RUNS_TOKEN")
              [ "$c" = "200" ] || c=$(req GET "https://api.github.com/repos/$THIS_REPO/actions/runs/$rid/artifacts" "$SWEEP_TOKEN")
              [ "$c" = "200" ] || continue
              art_url=$(jq -r '[.artifacts[] | select(.name == "alert-reading") | select(.expired | not) | .archive_download_url] | first // ""' < "$body")
              if [ -n "$art_url" ]; then prev_run=$rid; break; fi
            done <<< "$runs"

            if [ -z "$art_url" ]; then
              echo "no previous reading is reachable, so this run is a first reading over the whole population and raises nothing"
            else
              zip=$(mktemp)
              c=$(curl -sSL -m 120 -o "$zip" -w '%{http_code}' \
                    -H "Accept: application/vnd.github+json" \
                    -H "Authorization: Bearer $RUNS_TOKEN" "$art_url") || c=000
              if [ "$c" != "200" ]; then
                c=$(curl -sSL -m 120 -o "$zip" -w '%{http_code}' \
                      -H "Accept: application/vnd.github+json" \
                      -H "Authorization: Bearer $SWEEP_TOKEN" "$art_url") || c=000
              fi
              if [ "$c" != "200" ]; then
                echo "::error::the previous reading, run $prev_run, answered $c on download. Refusing rather than comparing against nothing and calling the result a first reading."
                exit 1
              fi
              unzip -p "$zip" reading.tsv > "$baseline"
              echo "baseline: run $prev_run, $(grep -c '^A' "$baseline" || true) rule line(s)"
            fi
          fi

          cp "$today" reading.tsv
          # The configuration is kept beside the reading rather than compared
          # against yesterday's: a row is judged against what the page declares,
          # not against what the board was last week. It is kept so that a run's
          # verdict can be re-read afterwards from the same bytes that produced
          # it.
          cp "$config" config.tsv

          # ------------------------------------------------------------------
          # The judgement.
          # ------------------------------------------------------------------
          moves=$(mktemp)
          deltas "$baseline" "$today" > "$moves"
          risen=$(awk -F'\t' '$6 != "first-reading"' "$moves" || true)
          firsts=$(awk -F'\t' '$6 == "first-reading"' "$moves" || true)
          echo "judgement: $(printf '%s\n' "$risen" | grep -c .) rule(s) new or risen, $(printf '%s\n' "$firsts" | grep -c .) pair(s) read for the first time"

          # THE DIGEST IS COMPOSED ONCE AND USED TWICE (iderex/wache#48): it is
          # this run's step summary and it is the body written into the register
          # issue. Two texts built separately from the same data would drift the
          # first time one of them was edited, and a register that disagrees with
          # the run it names is worse than no register.
          digest=$(mktemp)

          {
            echo "## Fleet alert sweep"
            echo
            if [ "$seeded" = "1" ]; then echo "**Seeded run.** No board was read and no reading was kept."; echo; fi
            echo "| board | kind | rule | was | now |"
            echo "| --- | --- | --- | --- | --- |"
            if [ -n "$risen" ]; then
              printf '%s\n' "$risen" | awk -F'\t' '{ print "| " $1 " | " $2 " | `" $3 "` | " $4 " | " $5 " |" }'
            else
              echo "| _nothing rose_ | | | | |"
            fi
            echo
            echo "Pairs not read on this run, which are not pairs with no alerts:"
            echo
            if awk -F'\t' '$1 == "S" && $4 != "read"' "$today" | grep -q .; then
              echo '```'
              awk -F'\t' '$1 == "S" && $4 != "read" { print $2 "  " $3 "  " $4 }' "$today"
              echo '```'
            else
              echo "none."
            fi
            echo
            echo "Pairs read for the first time, recorded and deliberately not raised:"
            echo
            if [ -n "$firsts" ]; then
              echo '```'
              printf '%s\n' "$firsts" | awk -F'\t' '{ print $1 "  " $2 }'
              echo '```'
            else
              echo "none."
            fi
          } >> "$digest"

          # ------------------------------------------------------------------
          # The baseline rows. A seeded run reads no board, so it has no
          # configuration to judge and says so rather than judging an empty one.
          # ------------------------------------------------------------------
          named=$(mktemp)
          : > "$named"
          if [ "$seeded" = "0" ]; then
            rows "$config" "$waivers" > "$named"
          fi
          short_n=$(awk -F'\t' '$3 == "short"' "$named" | grep -c . || true)
          echo "baseline: $short_n board-control(s) short of a row, $(grep -c . "$named" || true) line(s) named in all"

          {
            echo
            echo "## Baseline rows"
            echo
            if [ "$seeded" = "1" ]; then
              echo "**Seeded run.** No board was read, so no configuration was judged."
            else
              echo "The rows are declared in \`$BASELINE_PAGE\` and the register of recorded reasons is read out of the same page. A board named \`short\` is outside its own row with no recorded reason; \`unjudged\` is a reading that did not answer and is not a board that is clean."
              echo
              echo "| board | control | verdict | reading |"
              echo "| --- | --- | --- | --- |"
              if grep -q . "$named"; then
                awk -F'\t' '{ print "| " $1 " | " $2 " | " $3 " | " $4 " |" }' "$named"
              else
                echo "| _every board swept is in its row_ | | | |"
              fi
            fi
          } >> "$digest"

          cat "$digest" >> "$GITHUB_STEP_SUMMARY"

          # ------------------------------------------------------------------
          # The register (iderex/wache#48). WRITTEN BEFORE THE EARLY EXIT BELOW,
          # for the same reason `keep_reading` is: a run where nothing rose
          # leaves this step without reaching the filing block at all, and its
          # reading is exactly the one the register exists to keep.
          # ------------------------------------------------------------------
          write_register=$(may_register "$seeded" "${DRY_RUN:-false}" "${REF_NAME:-}" "${DEFAULT_BRANCH:-}")
          if [ "$write_register" != "1" ]; then
            echo "register: not written by this run, which is a $( [ "$seeded" = "1" ] && printf 'seeded run' || { [ "${DRY_RUN:-false}" = "true" ] && printf 'dry run' || printf 'run on %s rather than on %s' "${REF_NAME:-an unnamed ref}" "${DEFAULT_BRANCH:-an unnamed default branch}"; } )"
          elif [ -z "${REGISTER_ISSUE:-}" ]; then
            echo "::warning::this run may write the register and no register issue is named, so its reading lands in this run summary and its artifact alone. That is the home iderex/wache#48 was opened against."
          else
            reg=$(mktemp)
            {
              echo "This body is written by the \`Fleet alert sweep\` workflow of this board on every ordinary run of it. An edit made here by hand is overwritten by the next run, without warning and without a record of what it said, so a correction belongs in the sweep or in \`$BASELINE_PAGE\` and never in this body."
              echo
              echo "Run [\`$THIS_RUN\`](https://github.com/$THIS_REPO/actions/runs/$THIS_RUN), from \`$GITHUB_SHA\`, read at $(date -u '+%Y-%m-%d %H:%M:%SZ'). The edit history of this body is the register's history: every reading before this one is in it, addressed by this issue's number rather than by knowing that a run existed."
              echo
              cat "$digest"
            } > "$reg"
            body_out=$(mktemp)
            clamp "$reg" 60000 > "$body_out"
            payload=$(mktemp)
            jq -n --rawfile b "$body_out" '{body: $b}' > "$payload"
            code=$(req PATCH "https://api.github.com/repos/$THIS_REPO/issues/$REGISTER_ISSUE" "$REGISTER_TOKEN" "$payload")
            if [ "$code" = "200" ]; then
              echo "register: this reading is in $THIS_REPO#$REGISTER_ISSUE, $(wc -c < "$body_out" | tr -d ' ') byte(s)"
            else
              # IT WARNS RATHER THAN REFUSING, and that is a trade rather than an
              # oversight. The artifact this run keeps is uploaded on `success()`
              # alone, so failing here would throw away the day's reading to
              # report that one copy of it did not land - and the reading is
              # still in this run's summary and in that artifact. What is lost is
              # the permanent home, which is exactly what the line below says out
              # loud rather than leaving to be noticed.
              echo "::warning::the register $THIS_REPO#$REGISTER_ISSUE answered $code, so it still carries the PREVIOUS run's reading and not this one. This run's reading is in this run summary and in its artifact, both of which expire. Nothing here refuses on it, because the artifact is kept on a green run alone."
            fi
            rm -f "$reg" "$body_out" "$payload"
          fi

          echo "seeded=$seeded" >> "$GITHUB_ENV"
          # WRITTEN BEFORE THE EARLY EXIT BELOW, not beside the filing. A run
          # where nothing rose leaves here without reaching the filing block at
          # all, and its reading is exactly the one the next run needs.
          echo "keep_reading=$(may_keep "$seeded" "${DRY_RUN:-false}")" >> "$GITHUB_ENV"
          # WRITTEN HERE FOR THE SAME REASON AND READ BY THE LAST STEP OF THIS
          # JOB. A run where nothing rose leaves this step at the exit below,
          # and its configuration reading is exactly the one worth refusing on.
          echo "baseline_verdict=$(baseline_refuses "$short_n")" >> "$GITHUB_ENV"

          if [ -z "$risen" ]; then
            echo "nothing rose, so nothing is filed"
            exit 0
          fi

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "dry run: the moves below are reported and no tracker is written"
            printf '%s\n' "$risen"
            exit 0
          fi

          # ------------------------------------------------------------------
          # The filing. One issue per board, opened or updated, never a second.
          # ------------------------------------------------------------------
          filed=0
          updated=0
          failed=0
          for board in $(printf '%s\n' "$risen" | cut -f1 | LC_ALL=C sort -u); do
            writer=$(awk -F'\t' -v b="$board" '$1 == b { print $2; exit }' "$boardsfile")
            [ -n "$writer" ] || writer=iderex
            rows=$(printf '%s\n' "$risen" | awk -F'\t' -v b="$board" '$1 == b')

            md=$(mktemp)
            {
              echo "Open security alerts on this board are higher than they were at the previous reading, or carry a rule id that reading did not hold."
              echo
              echo "| kind | rule | was | now |"
              echo "| --- | --- | --- | --- |"
              printf '%s\n' "$rows" | awk -F'\t' '{ print "| " $2 " | `" $3 "` | " $4 " | " $5 " |" }'
              echo
              echo "Every row is a count of open alerts grouped by rule id. The current state is read directly:"
              echo
              echo '```'
              for k in $(printf '%s\n' "$rows" | cut -f2 | LC_ALL=C sort -u); do
                echo "gh api \"repos/$board/$k/alerts?state=open&per_page=100\" --jq 'length'"
              done
              echo '```'
              echo
              echo "## What this is not"
              echo
              echo "It is not a judgement of any alert. Nothing here reads a finding, weighs it, or says whether it is a true positive; the reading is a count of what the platform reports as open, grouped by rule id."
              echo
              echo "A count that falls produces no issue and no comment, so this body going quiet is not evidence that anything was fixed."
              echo
              echo "A kind that could not be read on a run contributes no count on that run and is named in that run's summary rather than passed over as a zero."
              echo
              echo "The sweep behind this is \`.github/workflows/fleet-alert-sweep.yml\` in \`iderex/wache\`, asked for by \`iderex/wache#31\`."
            } > "$md"

            payload=$(mktemp)
            code=$(req GET "https://api.github.com/repos/$board/issues?state=open&per_page=100" "$SWEEP_TOKEN")
            if [ "$code" != "200" ]; then
              echo "::warning::the open issues of $board answered $code, so whether that board already carries this issue is unknown. Nothing is filed there, because a sweep that cannot check for a duplicate must not create one."
              failed=$((failed + 1))
              continue
            fi
            existing=$(match_open_issue "$(cat "$body")" "$ISSUE_TITLE")

            if [ -n "$existing" ]; then
              jq -n --rawfile b "$md" '{body: $b}' > "$payload"
              code=$(req PATCH "https://api.github.com/repos/$board/issues/$existing" "$SWEEP_TOKEN" "$payload")
              if [ "$code" != "200" ]; then
                echo "::warning::updating $board#$existing answered $code"
                failed=$((failed + 1)); continue
              fi
              jq -n --rawfile b "$md" '{body: $b}' > "$payload"
              code=$(req POST "https://api.github.com/repos/$board/issues/$existing/comments" "$SWEEP_TOKEN" "$payload")
              [ "$code" = "201" ] || echo "::warning::commenting on $board#$existing answered $code"
              echo "updated  $board#$existing"
              updated=$((updated + 1))
            else
              jq -n --arg t "$ISSUE_TITLE" --arg a "$writer" --rawfile b "$md" \
                 '{title: $t, body: $b, assignees: [$a]}' > "$payload"
              code=$(req POST "https://api.github.com/repos/$board/issues" "$SWEEP_TOKEN" "$payload")
              if [ "$code" != "201" ]; then
                echo "::warning::opening an issue on $board answered $code"
                head -c 300 "$body"; echo
                failed=$((failed + 1)); continue
              fi
              num=$(jq -r '.number' < "$body")
              echo "opened   $board#$num"
              filed=$((filed + 1))
              # A LABEL IS ADDED ONLY WHERE THE BOARD ALREADY HOLDS IT. Passing a
              # label a board does not hold creates it, and this sweep does not
              # get to invent a vocabulary on somebody else's tracker.
              lc=$(req GET "https://api.github.com/repos/$board/labels/security" "$SWEEP_TOKEN")
              if [ "$lc" = "200" ]; then
                printf '{"labels":["security"]}' > "$payload"
                code=$(req POST "https://api.github.com/repos/$board/issues/$num/labels" "$SWEEP_TOKEN" "$payload")
                [ "$code" = "200" ] || echo "::warning::labelling $board#$num answered $code"
              else
                echo "::warning::$board holds no \`security\` label, so $board#$num carries none, and no label is created on another board's tracker from here."
              fi
              echo "::warning::$board#$num carries no milestone. The milestones of another board are that board's own and this sweep does not choose one."
            fi
            rm -f "$md" "$payload"
          done

          echo "filed $filed issue(s), updated $updated, and $failed board(s) could not be written"
          [ "$failed" = "0" ] || exit 1

      - name: Keep this reading for the next run
        # A SEEDED RUN KEEPS NOTHING. Its reading is an argument to a proof, and
        # keeping it would make it the next run's baseline - which is how a proof
        # poisons the thing it was proving.
        #
        # A FAILED RUN KEEPS NOTHING EITHER, which is `success()` rather than
        # `always()` and is the safe direction of a wrong guess. A run whose
        # filing failed halfway would otherwise hand the rises it did not manage
        # to file to the next run as the baseline they were measured against, and
        # they would never be raised again. Dropping the reading instead costs a
        # repeated comparison, and the repeat finds the issue it already opened
        # and updates it.
        #
        # A DRY RUN KEEPS NOTHING, AND THIS STEP SAID ONLY THE TWO ABOVE. It is
        # the second case with the filing never attempted rather than failed:
        # the run reads the whole fleet, reports what rose, writes to no
        # tracker, and its reading would put every one of those rises inside the
        # baseline they were next measured against. It was found by causing it -
        # `iderex/wache#52` carries the run, the twelve rises it reported and
        # the artifact that had to be deleted by hand. `env.keep_reading` is
        # `may_keep` in the step above rather than an expression here, so the
        # condition has fixtures.
        if: ${{ success() && env.keep_reading == '1' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: alert-reading
          # `reading.tsv` is the one the next run compares against and is read
          # back by name on download. `config.tsv` is this run's configuration
          # reading, kept so the baseline verdict above can be re-derived rather
          # than only re-read.
          path: |
            reading.tsv
            config.tsv
          retention-days: 90
          if-no-files-found: error

      - name: Refuse a board that left its baseline row
        # LAST, AND THE ORDER IS THE WHOLE DESIGN (iderex/wache#32). The step
        # above keeps this run's reading and is guarded on `success()`, so it has
        # already run by the time this one reds the job. Deciding the verdict in
        # the judging step and APPLYING it here is what lets a configuration
        # shortfall fail the run without costing the day's alert delta.
        #
        # `always()` rather than a condition on the verdict, because a run whose
        # judging step died leaves no verdict at all, and this step has to say
        # that rather than be skipped into silence. What it does with that case
        # is exit 0: the job is already red from the step that died, and a second
        # error invented here would only bury the first.
        if: ${{ always() }}
        env:
          BASELINE_VERDICT: ${{ env.baseline_verdict }}
          BASELINE_PAGE: docs/scanning-baseline.md
        run: |
          set -euo pipefail
          case "${BASELINE_VERDICT:-}" in
            clean)
              echo "every board swept is inside its own baseline row"
              exit 0
              ;;
            no-verdict | '')
              echo "the baseline leg reached no verdict on this run, so nothing here is refused. What happened to it is in the step that judges the fleet."
              exit 0
              ;;
          esac
          echo "::error::a board of the roster is outside the baseline row its visibility puts it in, with no reason recorded in $BASELINE_PAGE. The board, the control and the reading are in this run's summary and in the register issue this run wrote. Either the setting goes back on, or the reason is written into the register on that page - a board that deliberately does not scan is not the same thing as one nobody noticed."
          exit 1
