# This board is the first caller of the check it holds.
#
# The local path form resolves against THIS commit rather than against a tag or
# a branch, so a pull request here is judged by the version it is proposing and
# not by the one already on the mainline. That is what makes this board its own
# proof: a change that breaks the check fails its own pull request.
name: Hygiene

# THE TYPES ARE DECLARED BECAUSE THE DEFAULT SET DOES NOT INCLUDE `edited`
# (issue #22). What this check judges is the pull request BODY and TITLE, and
# both are editable after the run that judged them. With the default
# `opened, synchronize, reopened` a body was read once and never again, so a
# green status could stand over bytes that had since been replaced - measured
# on pull request #21, where a body edit produced no second run at all.
#
# `edited` fires on a title, body or base-branch change, which is exactly the
# set this check reads. The trigger belongs to the caller: `pr-hygiene.yml`
# runs on `workflow_call` and declares no events of its own, so this gap could
# only ever be closed here and in the calling examples of the README.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

# THE CALLER HAS TO GRANT WHAT THE CALLED WORKFLOW ASKS FOR. This said
# `permissions: {}` and the run ended in startup_failure before a single job
# existed, because pr-hygiene.yml asks for `contents: read` to check the tree
# out and a called workflow cannot hold more than its caller. The failure
# carries no message on the API, so it is written down here instead.
# `issues: read` IS HERE BECAUSE OF WHAT IS PASSED BELOW AND FOR NO OTHER
# REASON. `resolve_referenced_numbers` asks the tracker whether the number a
# commit subject names is an issue, a called workflow cannot hold more
# permission than its caller, and the token it reads with is the one this
# workflow hands it. Take either line out and the other stops meaning anything:
# without the permission the lookups come back refused and the run reds,
# without the secret the job refuses before it makes one.
permissions:
  contents: read
  issues: read

jobs:
  hygiene:
    uses: ./.github/workflows/pr-hygiene.yml
    # THIS BOARD IS THE FIRST CALLER TO TURN THIS ON, which is the same reason
    # it calls its own check at all: an answer nobody has executed is a green
    # line with nothing behind it. The input defaults to off and no other board
    # moves for this.
    with:
      resolve_referenced_numbers: true
      # THE SAME REASON ONE LINE DOWN (issue #66). This board is the first
      # caller to turn the body rule on, because an answer nobody has executed
      # is a green line with nothing behind it. The input is off by default and
      # no other board moves for this.
      #
      # THE EXEMPTION IS NOT OPTIONAL HERE. This board carries
      # `.github/dependabot.yml`, so it opens dependency-update pull requests
      # whose bodies name no issue and cannot - without this line the rule above
      # reds every one of them, which is the live consequence the reading on #66
      # names rather than a hypothetical.
      body_names_issue: true
      body_exempt_authors: |
        dependabot[bot]
    secrets:
      issue_read_token: ${{ secrets.GITHUB_TOKEN }}
