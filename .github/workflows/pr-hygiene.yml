# What a pull request owes - written ONCE, and the boards call it.
#
# WHY THIS FILE EXISTS (iderex/operations#1556). On 22.08. nineteen boards
# carried nineteen implementations of the same rule, in four languages, no two
# alike. What they enforce is three or four rules; what differs is the wording -
# fourteen boards want an issue named and say so twenty-eight different ways -
# and four points of contention nobody had ever decided once. A two-line change
# across thirty-seven boards therefore took six attempts.
#
# THE FOUR ANSWERS LIVE IN operations store/spec/pull-request-hygiene.md and are
# applied here, not re-argued:
#
#   the number goes in the commit subject line
#   it goes in square brackets, [#181]
#   Closes #N goes on a line of its own
#   a mention on another board counts, owner/repo#N
#
# THE FIXTURES RUN BEFORE THE JUDGEMENT, in the shape iderex/bremsweg found for
# its own version: a check that has never refused anything is a green line with
# nothing behind it. Every rule has a line that bites and a line that passes.
name: PR hygiene

on:
  workflow_call:
    inputs:
      subject_names_issue:
        description: 'Every non-merge commit names an issue in its subject'
        type: boolean
        default: true
        required: false
      # THE THREE BELOW ARE ANSWERS SIXTEEN BOARDS ALREADY HELD IN THEIR OWN
      # COPY OF THIS CHECK, carried in so that deleting the copy does not delete
      # the answer (issue #27). Reading those sixteen files found five answers
      # this check had no form of, and three of them would have turned work that
      # passes on those boards today into work that is refused the day the local
      # file goes. EVERY DEFAULT HERE IS TODAY'S BEHAVIOUR, so no board that
      # already calls this check moves when it lands; a board turns its answer
      # on in the same diff that removes its copy, where a reader can see it.
      subject_exempt_authors:
        description: >-
          Author addresses whose commits are not held to the subject rule, one
          per line. Automation cannot name an issue it does not know about, and
          three boards exempt it by an explicit allowlist of identities. Each
          entry is matched exactly, and against the `<id>+<entry>` form GitHub
          mints, where the `<id>` is digits and nothing else - never as a
          `*[bot]@...` glob and never with a local part of the caller's
          choosing, so `attacker+dependabot[bot]@users.noreply.github.com` is
          refused. WHAT THAT DOES NOT DO IS STOP SELF-EXEMPTION, and this input
          does not claim to. A git author address is a field typed by whoever
          commits, so anyone who types a listed address exactly is skipped, and
          nothing here reads which account opened the pull request. Empty
          exempts nobody.
        type: string
        default: ''
        required: false
      outside_contributions_exempt:
        description: >-
          Waive the subject rule for a pull request from a fork or from an
          author who is not an owner, member or collaborator. On a board that
          takes outside changes, the alternative is refusing a new
          contributor's first commit for a convention nobody has told them.
          `subject_names_issue: false` is the only other lever and it turns the
          rule off for everybody rather than for the case it was waived for.
        type: boolean
        default: false
        required: false
      message_is_ascii:
        description: >-
          Refuse a commit message carrying a byte outside printable US-ASCII,
          tab and newline. Three boards judge their message bytes by an
          allowlist rather than by a list of forbidden characters, and fail
          closed when the scanner errors rather than reading an error as a
          clean message. This is the commit message; the tree is the unicode
          guard's subject and a different question.
        type: boolean
        default: false
        required: false
      # THE INPUT BELOW IS THE ONE ANSWER OF THE FIVE THAT NEEDS SOMETHING THE
      # RUN CANNOT REACH (issue #36). The three above refuse or waive on bytes
      # already in the checkout - an author address, a message, the pull
      # request's own fork and association fields. This one asks the tracker,
      # so turning it on is a change to the CALLING CONTRACT and not a value
      # passed to a workflow that already runs.
      resolve_referenced_numbers:
        description: >-
          Resolve every issue number a commit subject names instead of only
          matching its shape. TURNING THIS ON TAKES TWO LINES IN THE CALLER, not
          one: `issues: read` in its `permissions:` block, and the
          `issue_read_token` secret below carrying its own `GITHUB_TOKEN`. Off
          by default, and a board that adds nothing moves nowhere. With it on, a
          subject naming a pull request, or a number that does not exist, is
          refused where the shape match passes it - and a lookup that does not
          answer is refused too, rather than being read as a number that checked
          out.
        type: boolean
        default: false
        required: false
    # THE TOKEN ARRIVES AS A SECRET AND NOT AS A JOB PERMISSION, AND THAT IS
    # MEASURED RATHER THAN PREFERRED. This job first asked for `issues: read` in
    # its own `permissions:` block, gated behind `if: inputs.resolve_...` so it
    # would be skipped for every caller that had not asked for it. THAT IS NOT
    # WHAT HAPPENS. A called workflow cannot hold more permission than its
    # caller, the comparison is made before any job is created, and the `if:`
    # never gets a chance to skip anything: this board's own caller, granting
    # `contents: read` alone and passing no inputs, reached `startup_failure`
    # with no job and no check run, on run 33193863320 of pull request #43. Every
    # one of the seventeen boards calling this file grants `contents: read`
    # alone, so shipping that would have taken the hygiene check off all
    # seventeen in one merge.
    #
    # A secret costs a caller that wants nothing exactly nothing: it is optional,
    # an absent one arrives empty, and no job here asks for a permission its
    # caller may not hold.
    secrets:
      issue_read_token:
        description: >-
          A token that may read issues on the boards a commit subject names.
          Pass the caller's own `GITHUB_TOKEN` from a workflow whose
          `permissions:` block grants `issues: read`. Required only when
          `resolve_referenced_numbers` is on; without it that job refuses rather
          than passing, because a lookup nothing could make is not a lookup that
          found nothing wrong.
        required: false

permissions: {}

# THE GROUP CARRIES THIS WORKFLOW'S OWN NAME, not the bare pattern a calling
# board's local guard is likely to use. This file runs on workflow_call, so its
# concurrency group is applied to the CALLER's run - and with the old group
# `pr-hygiene-<PR number>` plus cancel-in-progress, the shared run cancelled
# the calling board's own pr-hygiene run before it executed a step, on every
# push (issue #4; measured on sternwarte#105, schallweg#189, spurenarchiv#145,
# and live on bremsweg since its #143 merged). A cancelled local guard blocks
# nothing where no status check is required, so the board's own rules silently
# stopped being judged while looking present.
concurrency:
  group: wache-pr-hygiene-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  hygiene:
    name: Deterministic PR hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Judge the fixtures, then the change
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SUBJECT_RULE: ${{ inputs.subject_names_issue }}
          EXEMPT_AUTHORS: ${{ inputs.subject_exempt_authors }}
          OUTSIDE_EXEMPT: ${{ inputs.outside_contributions_exempt }}
          ASCII_RULE: ${{ inputs.message_is_ascii }}
          HEAD_IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
          AUTHOR_ASSOCIATION: ${{ github.event.pull_request.author_association }}
        run: |
          set -euo pipefail

          names_issue() {
            [[ "$1" =~ \[#[0-9]+\] ]] && return 0
            [[ "$1" =~ (^|[^A-Za-z0-9_/-])[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+ ]] && return 0
            return 1
          }

          # An entry matches the address itself, or GitHub's `<id>+<entry>`
          # form, in which the `<id>` is the digits the platform mints and not
          # a local part anybody may choose. The entry is expanded inside
          # quotes in the pattern, so `[bot]` is five literal characters and
          # not a bracket expression - which is the whole point of an allowlist
          # here.
          #
          # THE DIGITS ARE THE LEG. Without them the second pattern is
          # `*"+$entry"`, whose `*` is any local part at all, and a human could
          # exempt themselves from the subject rule by choosing an author
          # address - which is what the two paragraphs above used to say only a
          # `*[bot]@...` glob would allow. Issue #55. Delete the inner `case`
          # and the three `must_not_exempt` fixtures below turn the run red.
          is_exempt_author() {
            local address=$1 list=$2 entry id
            [ -n "$list" ] || return 1
            while IFS= read -r entry; do
              entry="${entry#"${entry%%[![:space:]]*}"}"
              entry="${entry%"${entry##*[![:space:]]}"}"
              [ -n "$entry" ] || continue
              case "$address" in
                "$entry") return 0 ;;
                *"+$entry")
                  id=${address%"+$entry"}
                  case "$id" in
                    '' | *[!0-9]*) ;;
                    *) return 0 ;;
                  esac
                  ;;
              esac
            done <<< "$list"
            return 1
          }

          # A fork is an outside contribution whatever the association says, and
          # so is an author the repository does not already carry. OWNER, MEMBER
          # and COLLABORATOR are the three that mean somebody already has write
          # access; everything else, CONTRIBUTOR and FIRST_TIME_CONTRIBUTOR
          # included, is outside. An empty or unknown association is treated as
          # outside rather than inside: the waiver only ever refuses less, so
          # failing towards it costs nothing a board did not ask for.
          is_outside_contribution() {
            local fork=$1 association=$2
            [ "$fork" = "true" ] && return 0
            case "$association" in
              OWNER | MEMBER | COLLABORATOR) return 1 ;;
            esac
            return 0
          }

          # The allowlist is printable US-ASCII plus tab and newline. `grep -c`
          # rather than `grep -q` so the three exits stay separable: 0 means a
          # byte outside the allowlist was found, 1 means clean, anything else
          # is a scanner error and is refused rather than read as clean.
          message_outside_ascii() {
            local rc=0
            printf '%s' "$1" | LC_ALL=C grep -qP '[^\x09\x0A\x20-\x7E]' || rc=$?
            case "$rc" in
              0) echo found ;;
              1) echo clean ;;
              *) echo "error $rc" ;;
            esac
          }

          refusals() {
            local title=$1 body=$2 flattened
            local -a words

            if [ -z "${body//[[:space:]]/}" ]; then
              echo "the body is empty"
            fi

            # EVERY LINE CARRYING A CLOSING KEYWORD IS JUDGED (issue #16). This
            # asked two questions about the body as a whole - is a closing
            # keyword anywhere in it, and is some line somewhere well-formed -
            # so one proper line exempted every improper one. A closure sitting
            # inside a paragraph passed whenever a proper line stood elsewhere,
            # and GitHub closed the paragraph's issue all the same.
            local line
            while IFS= read -r line; do
              if grep -qiE '(closes|fixes|resolves) +#[0-9]+' <<< "$line" \
                 && ! grep -qE '^(Closes|Fixes|Resolves) #[0-9]+[.]?$' <<< "$line"; then
                echo "a closing keyword must be the whole of its line and capitalised, as in Closes #7"
                break
              fi
            done <<< "$body"

            read -r -a words <<< "${title,,}"
            flattened="${words[*]}"
            case "$flattened" in
              "" | wip | "wip "* | "wip:"* | "[wip]"* | update | updates | fix \
              | fixes | change | changes | patch | test | tests | untitled \
              | "no title" | title | "new pull request" | "my changes")
                echo "the title is a placeholder"
                ;;
            esac
          }

          self_test=0
          must_refuse() {
            local name=$1 title=$2 body=$3 wanted=$4 got
            got=$(refusals "$title" "$body")
            if [[ $got == *"$wanted"* ]]; then
              echo "fixture ok     $name"
            else
              echo "FIXTURE FAILED $name"
              self_test=1
            fi
          }
          must_pass() {
            local name=$1 title=$2 body=$3 got
            got=$(refusals "$title" "$body")
            if [ -z "$got" ]; then
              echo "fixture ok     $name"
            else
              echo "FIXTURE FAILED $name: got $got"
              self_test=1
            fi
          }
          must_name() {
            if names_issue "$2"; then echo "fixture ok     $1"; else echo "FIXTURE FAILED $1"; self_test=1; fi
          }
          must_not_name() {
            if names_issue "$2"; then echo "FIXTURE FAILED $1"; self_test=1; else echo "fixture ok     $1"; fi
          }

          must_refuse   "an empty body is refused"        "A real title [#7]" "   "        "the body is empty"
          must_pass     "one line of body is enough"      "A real title [#7]" "Closes #7"
          must_refuse   "a placeholder title is refused"  "wip"               "Closes #7"  "the title is a placeholder"
          must_refuse   "a closing keyword mid-paragraph" "A real title [#7]" "Prose and Closes #7 inside it." "a closing keyword must be the whole of its line"
          must_refuse   "one good line excuses no bad one" "A real title [#7]" \
                        $'I explain here that this closes #8 by accident.\nCloses #7' \
                        "a closing keyword must be the whole of its line"
          must_refuse   "a lowercase closing keyword"     "A real title [#7]" "closes #7" "and capitalised"
          must_pass     "two closing lines, both proper"  "A real title [#7]" $'Closes #7\nCloses #8'
          must_refuse   "two issues on one closing line"  "A real title [#7]" \
                        $'Closes #7\nCloses #8 and #9' \
                        "a closing keyword must be the whole of its line"
          must_name     "square brackets count"           "A title [#181]"
          must_name     "another board counts"            "A title, refs iderex/operations#1552"
          must_not_name "round brackets do not count"     "A title (#181)"
          must_not_name "a bare number does not count"    "A title #181"
          must_not_name "a colour value is not a mention" "Set the accent to #181818"

          must_exempt() {
            if is_exempt_author "$2" "$3"; then echo "fixture ok     $1"; else echo "FIXTURE FAILED $1"; self_test=1; fi
          }
          must_not_exempt() {
            if is_exempt_author "$2" "$3"; then echo "FIXTURE FAILED $1"; self_test=1; else echo "fixture ok     $1"; fi
          }
          must_be_outside() {
            if is_outside_contribution "$2" "$3"; then echo "fixture ok     $1"; else echo "FIXTURE FAILED $1"; self_test=1; fi
          }
          must_be_inside() {
            if is_outside_contribution "$2" "$3"; then echo "FIXTURE FAILED $1"; self_test=1; else echo "fixture ok     $1"; fi
          }
          must_scan() { # name, message, wanted verdict
            local got
            got=$(message_outside_ascii "$2")
            if [ "$got" = "$3" ]; then
              echo "fixture ok     $1"
            else
              echo "FIXTURE FAILED $1: wanted $3, got $got"
              self_test=1
            fi
          }

          bots=$(printf '%s\n%s\n' 'dependabot[bot]@users.noreply.github.com' 'renovate[bot]@users.noreply.github.com')
          must_exempt     "a listed bot address"        'dependabot[bot]@users.noreply.github.com'          "$bots"
          must_exempt     "the id+bot form"             '49699333+dependabot[bot]@users.noreply.github.com' "$bots"
          must_exempt     "the second line of the list" 'renovate[bot]@users.noreply.github.com'            "$bots"
          must_not_exempt "a bot-shaped human address"  'dependabot[bot]@example.org'                       "$bots"
          must_not_exempt "a bot outside the list"      'github-actions[bot]@users.noreply.github.com'      "$bots"
          must_not_exempt "an ordinary author"          'ada@example.org'                                   "$bots"
          must_not_exempt "an empty list exempts nobody" 'dependabot[bot]@users.noreply.github.com'         ''
          # THE NEAR MISS IS ONE CHARACTER CLASS WIDE, so the three below are
          # the ones worth the lines. Each was exempt against this same list
          # until #55, and the last is the one somebody would actually write: a
          # local part that opens with the digits of a real id and then stops
          # being one.
          must_not_exempt "a chosen local part is not an id" 'attacker+dependabot[bot]@users.noreply.github.com'    "$bots"
          must_not_exempt "an empty id is not an id"         '+dependabot[bot]@users.noreply.github.com'            "$bots"
          must_not_exempt "digits then a word is not an id"  '4970attacker+dependabot[bot]@users.noreply.github.com' "$bots"

          must_be_outside "a fork, whatever the association" 'true'  'COLLABORATOR'
          must_be_outside "a first-time contributor"         'false' 'FIRST_TIME_CONTRIBUTOR'
          must_be_outside "a plain contributor"              'false' 'CONTRIBUTOR'
          must_be_outside "an association nobody sent"       'false' ''
          must_be_inside  "the owner"                        'false' 'OWNER'
          must_be_inside  "an organisation member"           'false' 'MEMBER'
          must_be_inside  "a collaborator on the board"      'false' 'COLLABORATOR'

          # THE BYTE IS BUILT AT RUNTIME AND NOT WRITTEN INTO THIS FILE. A
          # fixture carrying the character itself would be a literal in a tree
          # this board scans, and the escape decodes to the same two bytes while
          # the file on disk stays ASCII.
          latin1=$(printf 'Fix the Muenchen page, \303\244 [#7]')
          must_scan "an ordinary subject is clean"   'Read what the boards hold [#24]' clean
          must_scan "a tab and a newline are clean"  "$(printf 'A subject [#7]\n\n\tan indented line\n')" clean
          must_scan "a two-byte character is found"  "$latin1" found

          if [ "$self_test" != "0" ]; then
            echo "::error::the fixtures failed, so this run judges nothing"
            exit 1
          fi

          failed=0
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error::$line"
            failed=1
          done < <(refusals "${PR_TITLE:-}" "${PR_BODY:-}")

          subject_rule="$SUBJECT_RULE"
          if [ "$subject_rule" = "true" ] && [ "$OUTSIDE_EXEMPT" = "true" ] \
             && is_outside_contribution "${HEAD_IS_FORK:-false}" "${AUTHOR_ASSOCIATION:-}"; then
            echo "waive the subject rule: this is an outside contribution (fork=${HEAD_IS_FORK:-false}, association=${AUTHOR_ASSOCIATION:-none})"
            subject_rule=false
          fi

          if [ "$subject_rule" = "true" ] || [ "$ASCII_RULE" = "true" ]; then
            if ! base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
              echo "::error::the merge base is not in this clone, so no range can be read"
              exit 1
            fi
            while IFS= read -r sha; do
              [ -n "$sha" ] || continue

              if [ "$ASCII_RULE" = "true" ]; then
                case "$(message_outside_ascii "$(git log -1 --format=%B "$sha")")" in
                  found)
                    echo "::error::${sha:0:9} carries a byte outside printable US-ASCII in its message."
                    failed=1
                    ;;
                  clean) ;;
                  *)
                    # FAIL CLOSED. A scanner that could not read the message is
                    # not a message that was read and found clean, and reporting
                    # it as one is the failure this arm exists against.
                    echo "::error::the message scanner errored on ${sha:0:9}, so nothing was read. Refusing rather than assuming it is clean."
                    failed=1
                    ;;
                esac
              fi

              [ "$subject_rule" = "true" ] || continue

              author_email=$(git log -1 --format=%ae "$sha")
              if is_exempt_author "$author_email" "${EXEMPT_AUTHORS:-}"; then
                echo "skip  ${sha:0:9} (automation: $author_email)"
                continue
              fi
              subject=$(git log -1 --format=%s "$sha")
              if ! names_issue "$subject"; then
                echo "::error::${sha:0:9} names no issue in its subject. Put it in square brackets, or name another board as owner/repo#N."
                failed=1
              fi
            done < <(git rev-list --no-merges "$base..$HEAD_SHA")
          fi

          if [ "$SUBJECT_RULE" != "true" ]; then
            echo "the subject rule is off for this repository, so no commit subject was read"
          elif [ "$subject_rule" != "true" ]; then
            echo "the subject rule is on for this repository and was waived for this pull request, so no commit subject was read"
          fi
          if [ "$ASCII_RULE" != "true" ]; then
            echo "the message allowlist is off for this repository, so no message bytes were read"
          fi

          [ "$failed" = "0" ] || exit 1
          echo "the body, the title and every commit judged carry what they owe"

  # A SECOND JOB RATHER THAN A SECOND ARM ON THE FIRST, so that a caller which
  # has not turned this on runs nothing extra and sees nothing extra in its
  # checks list. ITS PERMISSIONS ARE THE SAME AS THE JOB ABOVE, deliberately:
  # the reading that made this file ask for a permission it does not need is
  # written at the `issue_read_token` secret above, with the run that produced
  # it.
  references:
    name: Every referenced number is an issue that exists
    if: ${{ inputs.resolve_referenced_numbers }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Judge the fixtures, then the references
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          THIS_REPO: ${{ github.repository }}
          ISSUE_READ_TOKEN: ${{ secrets.issue_read_token }}
        run: |
          set -euo pipefail

          # `[#N]` resolves against the board the pull request is on; a mention
          # written `owner/repo#N` resolves against the board it names. Both
          # shapes are the ones the job above already matches, read out of the
          # same subject rather than out of a second convention.
          #
          # EVERY PIPELINE HERE ENDS IN `|| true` AND THE FUNCTION IN
          # `return 0`, WHICH IS NOT DEFENSIVE NOISE. `grep` exits 1 when it
          # matches nothing, `set -o pipefail` carries that out of the pipeline,
          # and the live loop below reads this function into a variable with
          # `targets=$(reference_targets ...)` - an assignment whose status IS
          # the substitution's, so under `set -e` a subject naming no number
          # killed the whole step instead of being skipped. It did, on a range
          # of five real commits, before the fixture below existed to say so.
          reference_targets() {
            local subject=$1 repo=$2 n
            printf '%s' "$subject" | grep -oE '\[#[0-9]+\]' | tr -d '[]#' |
              while IFS= read -r n; do [ -n "$n" ] && printf '%s#%s\n' "$repo" "$n"; done || true
            printf '%s' "$subject" |
              grep -oE '(^|[^A-Za-z0-9_/-])[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[0-9]+' |
              sed -E 's/^[^A-Za-z0-9_.-]+//' || true
            return 0
          }

          # Reads the function the way the live loop reads it - into a variable -
          # and prints the exit status beside the result, so a fixture pins the
          # status and not only the text.
          assigned_targets() {
            local out rc=0
            out=$(reference_targets "$1" 'iderex/wache') || rc=$?
            printf '%s|%s' "$rc" "$(printf '%s' "$out" | tr '\n' ' ')"
          }

          # THE ISSUES ENDPOINT ANSWERS FOR A PULL REQUEST TOO, and that is the
          # whole reason this reads a body rather than a status code alone: a
          # pull request comes back 200 and carries a `pull_request` key, which
          # an issue does not. Anything that is neither is an unanswered lookup
          # and never a pass.
          classify() {
            local status=$1 body=$2
            case "$status" in
              200) ;;
              404) echo missing ; return 0 ;;
              401 | 403) echo "unauthorised $status" ; return 0 ;;
              *) echo "unanswered $status" ; return 0 ;;
            esac
            if printf '%s' "$body" | jq -e 'has("pull_request")' >/dev/null 2>&1; then
              echo pull-request
            elif printf '%s' "$body" | jq -e 'has("number")' >/dev/null 2>&1; then
              echo issue
            else
              echo "unanswered unreadable-body"
            fi
          }

          # THE REFUSAL ITSELF, so that a fixture reaches it rather than only
          # the classification feeding it. A guard whose fixtures sit one
          # function below the refusal stays green when the refusal is deleted,
          # which is the shape calling-examples.yml already found here.
          judge_reference() {
            local sha=$1 target=$2 verdict=$3
            case "$verdict" in
              issue)
                echo "ok    ${sha:0:9} names $target, and it is an issue"
                return 0
                ;;
              pull-request)
                echo "::error::${sha:0:9} names $target, which is a pull request and not an issue. The subject rule asks for an issue."
                return 1
                ;;
              missing)
                echo "::error::${sha:0:9} names $target, and there is no such issue."
                return 1
                ;;
              unauthorised*)
                echo "::error::${sha:0:9} names $target and the lookup was refused ($verdict). Grant \`issues: read\` in the calling workflow. Refusing rather than reading a refused lookup as a number that checked out."
                return 1
                ;;
              *)
                echo "::error::${sha:0:9} names $target and the lookup did not answer ($verdict), so nothing was read. Refusing rather than assuming the number is an issue."
                return 1
                ;;
            esac
          }

          # AN ABSENT TOKEN IS ITS OWN REFUSAL AND NOT A QUIET SKIP. A caller
          # that turned the input on and passed no secret asked for a reading
          # this job cannot make, and reporting that as a clean run is the same
          # failure as reading a 500 as a pass - one step earlier.
          judge_token() {
            local token=$1
            if [ -n "$token" ]; then
              echo "ok    a token reached this job"
              return 0
            fi
            echo "::error::resolve_referenced_numbers is on and no token reached this job. Grant \`issues: read\` in the calling workflow and pass its own GITHUB_TOKEN as the \`issue_read_token\` secret. Refusing rather than reporting a reading nothing could make."
            return 1
          }

          # Runs a refusal and prints its exit code beside the line it wrote, so
          # a fixture pins both.
          judged() {
            local out rc=0
            out=$(judge_reference "$@") || rc=$?
            printf '%s|%s' "$rc" "$out"
          }
          judged_token() {
            local out rc=0
            out=$(judge_token "$@") || rc=$?
            printf '%s|%s' "$rc" "$out"
          }

          self_test=0
          same() {
            if [ "$2" = "$3" ]; then
              echo "fixture ok     $1"
            else
              echo "FIXTURE FAILED $1: wanted [$3], got [$2]"
              self_test=1
            fi
          }

          same "square brackets resolve against this board" \
               "$(reference_targets 'A real title [#36]' 'iderex/wache' | tr '\n' ' ')" \
               "iderex/wache#36 "
          same "another board is taken as written" \
               "$(reference_targets 'A title, refs iderex/operations#1552' 'iderex/wache' | tr '\n' ' ')" \
               "iderex/operations#1552 "
          same "both shapes in one subject" \
               "$(reference_targets 'A title [#36] and iderex/operations#1552' 'iderex/wache' | tr '\n' ' ')" \
               "iderex/wache#36 iderex/operations#1552 "
          same "two numbers in brackets are two targets" \
               "$(reference_targets 'A title [#36] [#27]' 'iderex/wache' | tr '\n' ' ')" \
               "iderex/wache#36 iderex/wache#27 "
          same "a colour value is not a reference" \
               "$(reference_targets 'Set the accent to #181818' 'iderex/wache' | tr '\n' ' ')" \
               ""
          same "a bare number is not a reference" \
               "$(reference_targets 'A title #181' 'iderex/wache' | tr '\n' ' ')" \
               ""
          # THE NEAR MISS, AND IT IS THE ONE THAT ACTUALLY HAPPENED. A subject
          # naming no number has to leave the assignment with status 0, or the
          # step dies on the first ordinary commit instead of skipping it.
          same "a subject naming nothing assigns cleanly" \
               "$(assigned_targets 'Set the accent to #181818')" \
               "0|"
          same "a subject naming something assigns cleanly too" \
               "$(assigned_targets 'A real title [#36]')" \
               "0|iderex/wache#36"

          issue_body='{"number":36,"title":"a title","state":"open"}'
          pull_body='{"number":37,"title":"a title","pull_request":{"url":"https://example.invalid"}}'
          same "an issue body is an issue"        "$(classify 200 "$issue_body")" "issue"
          same "a pull request body is not"       "$(classify 200 "$pull_body")"  "pull-request"
          same "a 404 is a missing number"        "$(classify 404 '{"message":"Not Found"}')" "missing"
          same "a 403 names the permission"       "$(classify 403 '{"message":"Resource not accessible"}')" "unauthorised 403"
          same "a 500 is unanswered"              "$(classify 500 '{}')" "unanswered 500"
          same "curl not answering is unanswered" "$(classify 000 '')" "unanswered 000"
          same "a 200 with no number is unanswered" \
               "$(classify 200 'not json at all')" "unanswered unreadable-body"

          same "an issue passes and says so" \
               "$(judged 113085b269d3437a3f96ff9e7060b64b0af88ab1 iderex/wache#36 issue)" \
               "0|ok    113085b26 names iderex/wache#36, and it is an issue"
          same "a pull request is refused by name" \
               "$(judged 113085b269d3437a3f96ff9e7060b64b0af88ab1 iderex/wache#37 pull-request)" \
               "1|::error::113085b26 names iderex/wache#37, which is a pull request and not an issue. The subject rule asks for an issue."
          same "a number that does not exist is refused" \
               "$(judged 113085b269d3437a3f96ff9e7060b64b0af88ab1 iderex/wache#99999 missing)" \
               "1|::error::113085b26 names iderex/wache#99999, and there is no such issue."
          same "an unanswered lookup is refused, not passed" \
               "$(judged 113085b269d3437a3f96ff9e7060b64b0af88ab1 iderex/wache#36 'unanswered 500')" \
               "1|::error::113085b26 names iderex/wache#36 and the lookup did not answer (unanswered 500), so nothing was read. Refusing rather than assuming the number is an issue."

          same "a token that arrived passes and says so" \
               "$(judged_token 'a-token')" \
               "0|ok    a token reached this job"
          same "an absent token is refused, not skipped" \
               "$(judged_token '')" \
               "1|::error::resolve_referenced_numbers is on and no token reached this job. Grant \`issues: read\` in the calling workflow and pass its own GITHUB_TOKEN as the \`issue_read_token\` secret. Refusing rather than reporting a reading nothing could make."

          if [ "$self_test" != "0" ]; then
            echo "::error::the fixtures failed, so this run judges nothing"
            exit 1
          fi

          judge_token "${ISSUE_READ_TOKEN:-}" || exit 1
          GH_TOKEN=${ISSUE_READ_TOKEN:-}

          body_file=$(mktemp)
          lookup_status=""
          lookup_body=""
          lookup() {
            local target=$1 repo num
            repo=${target%%#*}
            num=${target##*#}
            lookup_status=$(curl -sS -m 20 -o "$body_file" -w '%{http_code}' \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$repo/issues/$num") || lookup_status=000
            lookup_body=$(cat "$body_file")
          }

          if ! base=$(git merge-base "$BASE_SHA" "$HEAD_SHA" 2>/dev/null); then
            echo "::error::the merge base is not in this clone, so no range can be read"
            exit 1
          fi

          failed=0
          seen=0
          declare -A verdict_for=()
          while IFS= read -r sha; do
            [ -n "$sha" ] || continue
            subject=$(git log -1 --format=%s "$sha")
            targets=$(reference_targets "$subject" "$THIS_REPO")
            if [ -z "$targets" ]; then
              echo "skip  ${sha:0:9} names no number, so there is nothing to resolve"
              continue
            fi
            while IFS= read -r target; do
              [ -n "$target" ] || continue
              seen=$((seen + 1))
              if [ -z "${verdict_for[$target]+set}" ]; then
                lookup "$target"
                verdict_for[$target]=$(classify "$lookup_status" "$lookup_body")
              fi
              judge_reference "$sha" "$target" "${verdict_for[$target]}" || failed=1
            done <<< "$targets"
          done < <(git rev-list --no-merges "$base..$HEAD_SHA")

          echo "resolved $seen reference(s) over ${#verdict_for[@]} distinct number(s)"
          echo "NOT examined: whether the issue a subject names is the issue the change belongs to. This resolves a number, it does not judge a subject."

          [ "$failed" = "0" ] || exit 1
          echo "every number named in a commit subject resolves to an issue that exists"
