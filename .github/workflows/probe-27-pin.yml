# A probe, and it is removed in the next commit of this same pull request.
#
# The README's migration example pins `v1.2.0` and passes three inputs that
# version does not declare. What a caller in that state actually gets - a
# refusal before the job starts, or a run that ignores the values and judges by
# the old defaults - decides what the repaired paragraph has to say, and the two
# are different disclosures. This file asks the runner rather than assuming.
name: probe-27-pin

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  probe:
    uses: iderex/wache/.github/workflows/pr-hygiene.yml@113085b269d3437a3f96ff9e7060b64b0af88ab1 # v1.2.0
    with:
      subject_exempt_authors: |
        dependabot[bot]@users.noreply.github.com
      outside_contributions_exempt: true
      message_is_ascii: true
