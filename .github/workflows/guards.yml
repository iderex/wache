# This board runs the guards it holds, against itself.
#
# THE TROJAN SOURCE GUARD IS HELD HERE RATHER THAN CALLED, since `#28` was
# decided on 4 September 2026: the shared `unicode-guard.yml` is retired, and
# every board including this one runs its own local check. The job below is that
# file's job, moved without a change to the pattern, the fixtures or the job
# name, so a board comparing this against its own copy is comparing the same
# check. What is gone is the `workflow_call` entry point, and nothing outside
# this repository called it - read on `docs/unicode-guard-copies.md` rather
# than asserted.
#
# THE UNICODE GUARD STILL HAS A REASON TO RUN HERE BEYOND SELF-RESPECT. Its
# fixtures name the characters it forbids, and if they were written as
# characters rather than as escapes this file would refuse its own repository.
# Running it here is what would catch that. That reason is about this tree and
# not about sharing, so it does not retire with the shared copy.
#
# THE HYGIENE CHECK IS STILL CALLED rather than inlined, from `hygiene.yml` in
# the local path form, because it is a shared workflow that boards call and this
# board is the first of them. The local path form resolves against THIS commit,
# so a change to it is judged by the version it proposes rather than by the one
# already on the mainline. The job below loses that property with the entry
# point: it is now judged the same way, by sitting in the file that runs it.
name: Guards

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

concurrency:
  group: guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bidi:
    name: Reject Trojan Source Unicode
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step pushes via git, so do not persist the GITHUB_TOKEN in .git/config.
          persist-credentials: false

      - name: Prove the pattern, then apply it
        run: |
          set -euo pipefail

          # (*UTF) enables PCRE2 UTF-8 so \x{...} matches codepoints, not raw bytes.
          # U+2060 (word joiner) is included as an invisible control with no legitimate
          # use in source. U+FEFF (BOM) is deliberately NOT listed: a leading UTF-8 BOM
          # is legitimate and banning it would false-positive, and the reordering attack
          # does not rely on it.
          pattern='(*UTF)[\x{202A}-\x{202E}\x{2066}-\x{2069}\x{200E}\x{200F}\x{061C}\x{200B}-\x{200D}\x{2060}]'

          fixtures=$(mktemp -d)
          trap 'rm -rf "$fixtures"' EXIT
          self_test=0

          # THE FIXTURES CARRY ESCAPES AND NOT THE CHARACTERS THEMSELVES. A guard
          # whose own file contains what it forbids cannot live in a tree that
          # runs the guard: this repository would refuse itself. The escape is
          # decoded at runtime, so the bytes on disk stay ASCII and the fixture
          # still tests the real codepoint.
          #
          # THE BENIGN NEIGHBOURS GO THROUGH THE SAME DECODER, AND THEY DID NOT.
          # `an em dash` was written with U+002D and `an accent` with `Muenchen,
          # cafe creme`, so each wrote pure ASCII and then asked whether a pattern
          # for bidirectional and zero-width codepoints matched it. That is true of
          # every ASCII string ever written, so neither fixture could tell this
          # pattern from one widened to refuse dashes and accented letters: both
          # reported green against such a pattern.
          decode() { # backslash-u escapes to the characters they name
            printf '%s' "$1" | python3 -c 'import sys;sys.stdout.write(sys.stdin.read().encode().decode("unicode_escape"))'
          }

          must_catch() { # name, backslash-u escape of the character
            decode "$2" > "$fixtures/f"
            if grep -qIP "$pattern" "$fixtures/f"; then
              echo "fixture ok     $1 is caught"
            else
              echo "FIXTURE FAILED $1 is not caught, so the pattern no longer refuses what it names"
              self_test=1
            fi
          }
          must_pass() { # name, backslash-u escape of the text
            decode "$2" > "$fixtures/f"
            if grep -qIP "$pattern" "$fixtures/f"; then
              echo "FIXTURE FAILED $1 is refused, and it is not an attack"
              self_test=1
            else
              echo "fixture ok     $1 passes"
            fi
          }

          must_catch 'U+202E right-to-left override'      'let x = 1 \u202E // reversed'
          must_catch 'U+202D left-to-right override'      'a \u202D b'
          must_catch 'U+202A left-to-right embedding'     'a \u202A b'
          must_catch 'U+202B right-to-left embedding'     'a \u202B b'
          must_catch 'U+202C pop directional formatting'  'a \u202C b'
          must_catch 'U+2066 left-to-right isolate'       'a \u2066 b'
          must_catch 'U+2067 right-to-left isolate'       'a \u2067 b'
          must_catch 'U+2068 first strong isolate'        'a \u2068 b'
          must_catch 'U+2069 pop directional isolate'     'a \u2069 b'
          must_catch 'U+200E left-to-right mark'          'a \u200E b'
          must_catch 'U+200F right-to-left mark'          'a \u200F b'
          must_catch 'U+061C arabic letter mark'          'a \u061C b'
          must_catch 'U+200B zero width space'            'a \u200B b'
          must_catch 'U+200C zero width non-joiner'       'a \u200C b'
          must_catch 'U+200D zero width joiner'           'a \u200D b'
          must_catch 'U+2060 word joiner'                 'a \u2060 b'

          must_pass 'an em dash'        'a sentence \u2014 with an em dash'
          must_pass 'an accent'         'Nils Lehnen, M\u00FCnchen, caf\u00E9 cr\u00E8me'
          must_pass 'a byte order mark' '\uFEFFconst x = 1'
          must_pass 'ordinary source'   'func main() { fmt.Println("hello") }'

          if [ "$self_test" != "0" ]; then
            echo "::error::the fixtures failed, so this run judges nothing about the tree"
            exit 1
          fi

          # git grep: 0 = a match was found, 1 = clean, >=2 = scanner or tooling error.
          # The `|| rc=$?` keeps `set -e` from aborting on the clean exit 1. FAIL CLOSED
          # on any error rather than mistaking a broken scanner for a clean tree.
          rc=0
          git grep -nIP "$pattern" -- . || rc=$?
          case "$rc" in
            0)
              echo "::error::Dangerous bidirectional or invisible Unicode found (Trojan Source, CVE-2021-42574). Remove these control characters."
              exit 1
              ;;
            1)
              echo "No bidirectional or invisible Unicode control characters found, and the pattern was proven above."
              ;;
            *)
              echo "::error::unicode-guard scanner error (git grep exit $rc) - failing closed instead of assuming the tree is clean."
              exit 1
              ;;
          esac
